/mi><mo stretchy=\"false\" form=\"postfix\">)<\/mo><\/mrow><annotation encoding=\"application/x-tex\">\\frac{S\\rho}{a^3}(1 - 3\\cos^2\\varphi)<\/annotation><\/semantics><\/math>; it changes sign where <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mrow><mi mathvariant=\"normal\">cos<\/mi><mo>&#8289;<\/mo><\/mrow><mn>2<\/mn><\/msup><mi>φ<\/mi><mo>=<\/mo><mstyle displaystyle=\"false\"><mfrac><mn>1<\/mn><mn>3<\/mn><\/mfrac><\/mstyle><\/mrow><annotation encoding=\"application/x-tex\">\\cos^2\\varphi = \\tfrac13<\/annotation><\/semantics><\/math>, that is <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mi mathvariant=\"normal\">tan<\/mi><mo>&#8289;<\/mo><\/mrow><mi>φ<\/mi><mo>=<\/mo><msqrt><mn>2<\/mn><\/msqrt><\/mrow><annotation encoding=\"application/x-tex\">\\tan\\varphi = \\sqrt2<\/annotation><\/semantics><\/math>.<\/p>", "typst": "With $x = rho cos phi$, $y = rho sin phi$ the force towards the centre is $frac(S rho, a^3)\\(1 - 3 cos^2 phi\\)$\\; it changes sign where $cos^2 phi = 1 / 3$, that is $tan phi = sqrt(2)$."}, {"html": "<p>The angle whose tangent is <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msqrt><mn>2<\/mn><\/msqrt><annotation encoding=\"application/x-tex\">\\sqrt2<\/annotation><\/semantics><\/math> is 54°44′ to the nearest minute (54.7356°); Euler gives 54°45′ <em>circiter<\/em>.<\/p>", "typst": "The angle whose tangent is $sqrt(2)$ is 54°44′ to the nearest minute (54.7356°); Euler gives 54°45′ #emph[circiter]."}, {"html": "<p>Euler's Fig. 4, with the lines <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>F<\/mi><mi>C<\/mi><mi>I<\/mi><\/mrow><annotation encoding=\"application/x-tex\">FCI<\/annotation><\/semantics><\/math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>G<\/mi><mi>C<\/mi><mi>H<\/mi><\/mrow><annotation encoding=\"application/x-tex\">GCH<\/annotation><\/semantics><\/math>, is not drawn in the reconstruction.<\/p>", "typst": "Euler\\'s Fig. 4, with the lines $F C I$ and $G C H$, is not drawn in the reconstruction."}], "la": {"html": "<p><strong>28.<\/strong> Ex his igitur postremis formulis intelligitur ab actione Solis sive Lunae in <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>S<\/mi><annotation encoding=\"application/x-tex\">S<\/annotation><\/semantics><\/math> existentis gravitatem particulae <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>M<\/mi><annotation encoding=\"application/x-tex\">M<\/annotation><\/semantics><\/math> augeri, si eius situs respectu rectae <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>S<\/mi><mi>C<\/mi><\/mrow><annotation encoding=\"application/x-tex\">SC<\/annotation><\/semantics><\/math> ita fuerit comparatus, ut sit <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y<\/mi><mi>y<\/mi><mo>&gt;<\/mo><mn>2<\/mn><mi>x<\/mi><mi>x<\/mi><\/mrow><annotation encoding=\"application/x-tex\">yy &gt; 2xx<\/annotation><\/semantics><\/math> hoc est tangens anguli <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M<\/mi><mi>C<\/mi><mi>P<\/mi><mo>&gt;<\/mo><msqrt><mn>2<\/mn><\/msqrt><\/mrow><annotation encoding=\"application/x-tex\">MCP &gt; \\sqrt{2}<\/annotation><\/semantics><\/math> posito sinu toto <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mn>1<\/mn><\/mrow><annotation encoding=\"application/x-tex\">= 1<\/annotation><\/semantics><\/math>, contra vero gravitatem diminui, si fuerit <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y<\/mi><mi>y<\/mi><mo>&lt;<\/mo><mn>2<\/mn><mi>x<\/mi><mi>x<\/mi><\/mrow><annotation encoding=\"application/x-tex\">yy &lt; 2xx<\/annotation><\/semantics><\/math>. Quare cum <span class=\"ax-pb\" title=\"here page 38 begins\">|38|<\/span> angulus cuius tangens est <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><msqrt><mn>2<\/mn><\/msqrt><\/mrow><annotation encoding=\"application/x-tex\">= \\sqrt{2}<\/annotation><\/semantics><\/math> contineat <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mn>54<\/mn><mo>∘<\/mo><\/msup><mspace width=\"0.222em\"><\/mspace><msup><mn>45<\/mn><mo>′<\/mo><\/msup><\/mrow><annotation encoding=\"application/x-tex\">54^\\circ\\ 45&#39;<\/annotation><\/semantics><\/math> circiter, si concipiatur circulus Terrae maximus quicunque <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mi>D<\/mi><mi>B<\/mi><mi>E<\/mi><\/mrow><annotation encoding=\"application/x-tex\">ADBE<\/annotation><\/semantics><\/math> [fig. 4], cuius planum per punctum <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>S<\/mi><annotation encoding=\"application/x-tex\">S<\/annotation><\/semantics><\/math> transeat, in eoque ducantur rectae <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>F<\/mi><mi>C<\/mi><mi>I<\/mi><\/mrow><annotation encoding=\"application/x-tex\">FCI<\/annotation><\/semantics><\/math> et <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>G<\/mi><mi>C<\/mi><mi>H<\/mi><\/mrow><annotation encoding=\"application/x-tex\">GCH<\/annotation><\/semantics><\/math>, quae cum recta <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>S<\/mi><mi>A<\/mi><mi>B<\/mi><\/mrow><annotation encoding=\"application/x-tex\">SAB<\/annotation><\/semantics><\/math> angulos constituant <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mn>54<\/mn><mo>∘<\/mo><\/msup><mspace width=\"0.222em\"><\/mspace><msup><mn>45<\/mn><mo>′<\/mo><\/msup><\/mrow><annotation encoding=\"application/x-tex\">54^\\circ\\ 45&#39;<\/annotation><\/semantics><\/math>; tum omnes Terrae particulae in spatiis <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>F<\/mi><mi>C<\/mi><mi>H<\/mi><\/mrow><annotation encoding=\"application/x-tex\">FCH<\/annotation><\/semantics><\/math> et <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>G<\/mi><mi>C<\/mi><mi>I<\/mi><\/mrow><annotation encoding=\"application/x-tex\">GCI<\/annotation><\/semantics><\/math> sitae gravitatis naturalis augmentum accipient, reliquae vero particulae in spatiis <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>F<\/mi><mi>C<\/mi><mi>G<\/mi><\/mrow><annotation encoding=\"application/x-tex\">FCG<\/annotation><\/semantics><\/math> et <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>H<\/mi><mi>C<\/mi><mi>I<\/mi><\/mrow><annotation encoding=\"application/x-tex\">HCI<\/annotation><\/semantics><\/math> positae decrementum gravitatis patientur. Atque hinc, quacumque Terrae particula proposita, definiri poterit, quantum eius gravitas a Sole Lunave in <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>S<\/mi><annotation encoding=\"application/x-tex\">S<\/annotation><\/semantics><\/math> existente vel augeatur vel diminuatur.<\/p>", "typst": "#strong[\\28.] Ex his igitur postremis formulis intelligitur ab actione Solis sive Lunae in $S$ existentis gravitatem particulae $M$ augeri, si eius situs respectu rectae $S C$ ita fuerit comparatus, ut sit $y y > 2 x x$ hoc est tangens anguli $M C P > sqrt(2)$ posito sinu toto $= 1$, contra vero gravitatem diminui, si fuerit $y y < 2 x x$. Quare cum #emph[|38|] angulus cuius tangens est $= sqrt(2)$ contineat $54^compose med 45'$ circiter, si concipiatur circulus Terrae maximus quicunque $A D B E$ \\[fig. 4\\], cuius planum per punctum $S$ transeat, in eoque ducantur rectae $F C I$ et $G C H$, quae cum recta $S A B$ angulos constituant $54^compose med 45'$\\; tum omnes Terrae particulae in spatiis $F C H$ et $G C I$ sitae gravitatis naturalis augmentum accipient, reliquae vero particulae in spatiis $F C G$ et $H C I$ positae decrementum gravitatis patientur. Atque hinc, quacumque Terrae particula proposita, definiri poterit, quantum eius gravitas a Sole Lunave in $S$ existente vel augeatur vel diminuatur."}, "en": {"html": "<p><strong>28.<\/strong> From these latter formulas, therefore, it is understood that by the action of the Sun or Moon located at <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>S<\/mi><annotation encoding=\"application/x-tex\">S<\/annotation><\/semantics><\/math>, the gravity of the particle <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>M<\/mi><annotation encoding=\"application/x-tex\">M<\/annotation><\/semantics><\/math> is increased if its position with respect to the straight line <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>S<\/mi><mi>C<\/mi><\/mrow><annotation encoding=\"application/x-tex\">SC<\/annotation><\/semantics><\/math> is such that <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y<\/mi><mi>y<\/mi><mo>&gt;<\/mo><mn>2<\/mn><mi>x<\/mi><mi>x<\/mi><\/mrow><annotation encoding=\"application/x-tex\">yy &gt; 2xx<\/annotation><\/semantics><\/math>, that is, the tangent of the angle <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M<\/mi><mi>C<\/mi><mi>P<\/mi><mo>&gt;<\/mo><msqrt><mn>2<\/mn><\/msqrt><\/mrow><annotation encoding=\"application/x-tex\">MCP &gt; \\sqrt{2}<\/annotation><\/semantics><\/math> setting the total sine <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mn>1<\/mn><\/mrow><annotation encoding=\"application/x-tex\">= 1<\/annotation><\/semantics><\/math>; but on the contrary, the gravity is diminished if <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y<\/mi><mi>y<\/mi><mo>&lt;<\/mo><mn>2<\/mn><mi>x<\/mi><mi>x<\/mi><\/mrow><annotation encoding=\"application/x-tex\">yy &lt; 2xx<\/annotation><\/semantics><\/math>. Wherefore, since <span class=\"ax-pb\" title=\"here page 38 begins\">|38|<\/span> the angle whose tangent is <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><msqrt><mn>2<\/mn><\/msqrt><\/mrow><annotation encoding=\"application/x-tex\">= \\sqrt{2}<\/annotation><\/semantics><\/math> contains approximately <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mn>54<\/mn><mo>∘<\/mo><\/msup><mspace width=\"0.222em\"><\/mspace><msup><mn>45<\/mn><mo>′<\/mo><\/msup><\/mrow><annotation encoding=\"application/x-tex\">54^\\circ\\ 45&#39;<\/annotation><\/semantics><\/math>, if we conceive any great circle of the Earth <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mi>D<\/mi><mi>B<\/mi><mi>E<\/mi><\/mrow><annotation encoding=\"application/x-tex\">ADBE<\/annotation><\/semantics><\/math> [fig. 4], whose plane passes through the point <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>S<\/mi><annotation encoding=\"application/x-tex\">S<\/annotation><\/semantics><\/math>, and in it are drawn the straight lines <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>F<\/mi><mi>C<\/mi><mi>I<\/mi><\/mrow><annotation encoding=\"application/x-tex\">FCI<\/annotation><\/semantics><\/math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>G<\/mi><mi>C<\/mi><mi>H<\/mi><\/mrow><annotation encoding=\"application/x-tex\">GCH<\/annotation><\/semantics><\/math>, which make angles of <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mn>54<\/mn><mo>∘<\/mo><\/msup><mspace width=\"0.222em\"><\/mspace><msup><mn>45<\/mn><mo>′<\/mo><\/msup><\/mrow><annotation encoding=\"application/x-tex\">54^\\circ\\ 45&#39;<\/annotation><\/semantics><\/math> with the straight line <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>S<\/mi><mi>A<\/mi><mi>B<\/mi><\/mrow><annotation encoding=\"application/x-tex\">SAB<\/annotation><\/semantics><\/math>; then all the particles of the Earth situated in the spaces <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>F<\/mi><mi>C<\/mi><mi>H<\/mi><\/mrow><annotation encoding=\"application/x-tex\">FCH<\/annotation><\/semantics><\/math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>G<\/mi><mi>C<\/mi><mi>I<\/mi><\/mrow><annotation encoding=\"application/x-tex\">GCI<\/annotation><\/semantics><\/math> will receive an increase in natural gravity, while the remaining particles placed in the spaces <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>F<\/mi><mi>C<\/mi><mi>G<\/mi><\/mrow><annotation encoding=\"application/x-tex\">FCG<\/annotation><\/semantics><\/math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>H<\/mi><mi>C<\/mi><mi>I<\/mi><\/mrow><annotation encoding=\"application/x-tex\">HCI<\/annotation><\/semantics><\/math> will suffer a decrease in gravity. And from this, for any given particle of the Earth, it can be defined how much its gravity is either increased or diminished by the Sun or Moon existing at <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>S<\/mi><annotation encoding=\"application/x-tex\">S<\/annotation><\/semantics><\/math>.<\/p>", "typst": "#strong[\\28.] From these latter formulas, therefore, it is understood that by the action of the Sun or Moon located at $S$, the gravity of the particle $M$ is increased if its position with respect to the straight line $S C$ is such that $y y > 2 x x$, that is, the tangent of the angle $M C P > sqrt(2)$ setting the total sine $= 1$\\; but on the contrary, the gravity is diminished if $y y < 2 x x$. Wherefore, since #emph[|38|] the angle whose tangent is $= sqrt(2)$ contains approximately $54^compose med 45'$, if we conceive any great circle of the Earth $A D B E$ \\[fig. 4\\], whose plane passes through the point $S$, and in it are drawn the straight lines $F C I$ and $G C H$, which make angles of $54^compose med 45'$ with the straight line $S A B$\\; then all the particles of the Earth situated in the spaces $F C H$ and $G C I$ will receive an increase in natural gravity, while the remaining particles placed in the spaces $F C G$ and $H C I$ will suffer a decrease in gravity. And from this, for any given particle of the Earth, it can be defined how much its gravity is either increased or diminished by the Sun or Moon existing at $S$."}}, {"id": "horizontal-sign", "section": "§28", "heading": "The direction of the horizontal force", "pidx": [19], "pages": ["38"], "loci": ["fr:enestroem/E57/0019/p02"], "viewer": "enestroem/E57?p=20", "steps": [], "see": ["horizontal"], "model": [], "corrections": [], "notes": [{"html": "<p>This is the passage that connects the geometry with the phenomenon: the force is alike in the hemisphere under the luminary and in the opposite one, and so are the two tides of a day.<\/p>", "typst": "This is the passage that connects the geometry with the phenomenon: the force is alike in the hemisphere under the luminary and in the opposite one, and so are the two tides of a day."}], "la": {"html": "<p>Altera vero vis, qua particula <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>M<\/mi><annotation encoding=\"application/x-tex\">M<\/annotation><\/semantics><\/math> [fig. 3] in directione horizontali <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M<\/mi><mi>R<\/mi><\/mrow><annotation encoding=\"application/x-tex\">MR<\/annotation><\/semantics><\/math> urgetur, affirmativa erit, in eamque plagam, quae in figura repraesentatur, verget, si quantitates <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>x<\/mi><annotation encoding=\"application/x-tex\">x<\/annotation><\/semantics><\/math> et <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>y<\/mi><annotation encoding=\"application/x-tex\">y<\/annotation><\/semantics><\/math> ambae fuerint vel affirmativae vel negativae: contrariumque eveniet, si earum altera sit affirmativa, altera negativa. Quare si particula <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>M<\/mi><annotation encoding=\"application/x-tex\">M<\/annotation><\/semantics><\/math> [fig. 4] sita fuerit vel in quadrante <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mi>C<\/mi><mi>D<\/mi><\/mrow><annotation encoding=\"application/x-tex\">ACD<\/annotation><\/semantics><\/math> vel <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mi>C<\/mi><mi>E<\/mi><\/mrow><annotation encoding=\"application/x-tex\">ACE<\/annotation><\/semantics><\/math>, tum vis horizontalis ad rectam <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>C<\/mi><mi>A<\/mi><\/mrow><annotation encoding=\"application/x-tex\">CA<\/annotation><\/semantics><\/math> tendet; contra vero haec vis ad radium <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>C<\/mi><mi>B<\/mi><\/mrow><annotation encoding=\"application/x-tex\">CB<\/annotation><\/semantics><\/math> dirigetur, si particula <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>M<\/mi><annotation encoding=\"application/x-tex\">M<\/annotation><\/semantics><\/math> sit vel in quadrante <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>B<\/mi><mi>C<\/mi><mi>D<\/mi><\/mrow><annotation encoding=\"application/x-tex\">BCD<\/annotation><\/semantics><\/math> vel <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>B<\/mi><mi>C<\/mi><mi>E<\/mi><\/mrow><annotation encoding=\"application/x-tex\">BCE<\/annotation><\/semantics><\/math> constituta. Ex quibus perspicitur effectus vel Solis vel Lunae in ambo hemisphaeria, superius scilicet <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>D<\/mi><mi>A<\/mi><mi>E<\/mi><\/mrow><annotation encoding=\"application/x-tex\">DAE<\/annotation><\/semantics><\/math> et inferius <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>D<\/mi><mi>B<\/mi><mi>E<\/mi><\/mrow><annotation encoding=\"application/x-tex\">DBE<\/annotation><\/semantics><\/math>, inter se esse fere similes; quae similitudo quoque in ipso aestu Maris observatur.<\/p>", "typst": "Altera vero vis, qua particula $M$ \\[fig. 3\\] in directione horizontali $M R$ urgetur, affirmativa erit, in eamque plagam, quae in figura repraesentatur, verget, si quantitates $x$ et $y$ ambae fuerint vel affirmativae vel negativae: contrariumque eveniet, si earum altera sit affirmativa, altera negativa. Quare si particula $M$ \\[fig. 4\\] sita fuerit vel in quadrante $A C D$ vel $A C E$, tum vis horizontalis ad rectam $C A$ tendet; contra vero haec vis ad radium $C B$ dirigetur, si particula $M$ sit vel in quadrante $B C D$ vel $B C E$ constituta. Ex quibus perspicitur effectus vel Solis vel Lunae in ambo hemisphaeria, superius scilicet $D A E$ et inferius $D B E$, inter se esse fere similes; quae similitudo quoque in ipso aestu Maris observatur."}, "en": {"html": "<p>But the other force, by which the particle <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>M<\/mi><annotation encoding=\"application/x-tex\">M<\/annotation><\/semantics><\/math> [fig. 3] is urged in the horizontal direction <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M<\/mi><mi>R<\/mi><\/mrow><annotation encoding=\"application/x-tex\">MR<\/annotation><\/semantics><\/math>, will be positive, and will tend toward that region which is represented in the figure, if the quantities <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>x<\/mi><annotation encoding=\"application/x-tex\">x<\/annotation><\/semantics><\/math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>y<\/mi><annotation encoding=\"application/x-tex\">y<\/annotation><\/semantics><\/math> are both either positive or negative; and the opposite will happen if one of them is positive and the other negative. Therefore, if the particle <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>M<\/mi><annotation encoding=\"application/x-tex\">M<\/annotation><\/semantics><\/math> [fig. 4] is situated either in the quadrant <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mi>C<\/mi><mi>D<\/mi><\/mrow><annotation encoding=\"application/x-tex\">ACD<\/annotation><\/semantics><\/math> or <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mi>C<\/mi><mi>E<\/mi><\/mrow><annotation encoding=\"application/x-tex\">ACE<\/annotation><\/semantics><\/math>, then the horizontal force will tend toward the straight line <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>C<\/mi><mi>A<\/mi><\/mrow><annotation encoding=\"application/x-tex\">CA<\/annotation><\/semantics><\/math>; on the contrary, this force will be directed toward the radius <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>C<\/mi><mi>B<\/mi><\/mrow><annotation encoding=\"application/x-tex\">CB<\/annotation><\/semantics><\/math> if the particle <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>M<\/mi><annotation encoding=\"application/x-tex\">M<\/annotation><\/semantics><\/math> is located either in the quadrant <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>B<\/mi><mi>C<\/mi><mi>D<\/mi><\/mrow><annotation encoding=\"application/x-tex\">BCD<\/annotation><\/semantics><\/math> or <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>B<\/mi><mi>C<\/mi><mi>E<\/mi><\/mrow><annotation encoding=\"application/x-tex\">BCE<\/annotation><\/semantics><\/math>. From which it is perceived that the effects of either the Sun or the Moon on both hemispheres, namely the upper <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>D<\/mi><mi>A<\/mi><mi>E<\/mi><\/mrow><annotation encoding=\"application/x-tex\">DAE<\/annotation><\/semantics><\/math> and the lower <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>D<\/mi><mi>B<\/mi><mi>E<\/mi><\/mrow><annotation encoding=\"application/x-tex\">DBE<\/annotation><\/semantics><\/math>, are almost similar to each other; which similarity is also observed in the tide of the Sea itself.<\/p>", "typst": "But the other force, by which the particle $M$ \\[fig. 3\\] is urged in the horizontal direction $M R$, will be positive, and will tend toward that region which is represented in the figure, if the quantities $x$ and $y$ are both either positive or negative; and the opposite will happen if one of them is positive and the other negative. Therefore, if the particle $M$ \\[fig. 4\\] is situated either in the quadrant $A C D$ or $A C E$, then the horizontal force will tend toward the straight line $C A$\\; on the contrary, this force will be directed toward the radius $C B$ if the particle $M$ is located either in the quadrant $B C D$ or $B C E$. From which it is perceived that the effects of either the Sun or the Moon on both hemispheres, namely the upper $D A E$ and the lower $D B E$, are almost similar to each other; which similarity is also observed in the tide of the Sea itself."}, "reconstruction": {"html": "<p>Read off the horizontal force: 3Sxy/a³ has the sign of xy, that is of sin 2φ. No step of its own.<\/p>", "typst": "Read off the horizontal force: 3Sxy/a³ has the sign of xy, that is of sin 2φ. No step of its own."}}, {"id": "surface", "section": "§29", "heading": "On the surface: the greatest values", "pidx": [19, 20], "pages": ["38", "39"], "loci": ["fr:enestroem/E57/0019/p03", "fr:enestroem/E57/0020/p02"], "viewer": "enestroem/E57?p=20", "steps": ["horizontal"], "see": ["vertical"], "model": [], "corrections": [{"reason": "one sentence over the page break; Latin: Quare si particula M fuerit posita in M"}], "notes": [{"html": "<p>With the semidiameter of the earth as unit: at <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>D<\/mi><annotation encoding=\"application/x-tex\">D<\/annotation><\/semantics><\/math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>E<\/mi><annotation encoding=\"application/x-tex\">E<\/annotation><\/semantics><\/math> (<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>φ<\/mi><mo>=<\/mo><mn>90<\/mn><mi>°<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\varphi = 90°<\/annotation><\/semantics><\/math>) gravity is increased by <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>S<\/mi><mi>/<\/mi><msup><mi>a<\/mi><mn>3<\/mn><\/msup><\/mrow><annotation encoding=\"application/x-tex\">S/a^3<\/annotation><\/semantics><\/math>; at <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>A<\/mi><annotation encoding=\"application/x-tex\">A<\/annotation><\/semantics><\/math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>B<\/mi><annotation encoding=\"application/x-tex\">B<\/annotation><\/semantics><\/math> (<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>φ<\/mi><mo>=<\/mo><mn>0<\/mn><mi>°<\/mi><mo>,<\/mo><mn>180<\/mn><mi>°<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\varphi = 0°, 180°<\/annotation><\/semantics><\/math>) it is diminished by <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><mi>S<\/mi><mi>/<\/mi><msup><mi>a<\/mi><mn>3<\/mn><\/msup><\/mrow><annotation encoding=\"application/x-tex\">2S/a^3<\/annotation><\/semantics><\/math>; the horizontal force is greatest at <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>φ<\/mi><mo>=<\/mo><mn>45<\/mn><mi>°<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\varphi = 45°<\/annotation><\/semantics><\/math>, where it is <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3<\/mn><mi>S<\/mi><mi>/<\/mi><mn>2<\/mn><msup><mi>a<\/mi><mn>3<\/mn><\/msup><\/mrow><annotation encoding=\"application/x-tex\">3S/2a^3<\/annotation><\/semantics><\/math>. All three values follow from the two expressions of the steps cited.<\/p>", "typst": "With the semidiameter of the earth as unit: at $D$ and $E$ ($phi = 90 degree$) gravity is increased by $S\\/a^3$\\; at $A$ and $B$ ($phi = 0 degree\\,180 degree$) it is diminished by $2 S\\/a^3$\\; the horizontal force is greatest at $phi = 45 degree$, where it is $3 S\\/2 a^3$. All three values follow from the two expressions of the steps cited."}, {"html": "<p>The checks report <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>φ<\/mi><mo>=<\/mo><mn>0<\/mn><mi>°<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\varphi = 0°<\/annotation><\/semantics><\/math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>180<\/mn><mi>°<\/mi><\/mrow><annotation encoding=\"application/x-tex\">180°<\/annotation><\/semantics><\/math> as states the construction does not cover: there <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>M<\/mi><annotation encoding=\"application/x-tex\">M<\/annotation><\/semantics><\/math> lies on <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>C<\/mi><mi>S<\/mi><\/mrow><annotation encoding=\"application/x-tex\">CS<\/annotation><\/semantics><\/math> and the perpendicular <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M<\/mi><mi>P<\/mi><\/mrow><annotation encoding=\"application/x-tex\">MP<\/annotation><\/semantics><\/math> has no direction. Euler's value at <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>A<\/mi><annotation encoding=\"application/x-tex\">A<\/annotation><\/semantics><\/math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>B<\/mi><annotation encoding=\"application/x-tex\">B<\/annotation><\/semantics><\/math> is the value of the formula there.<\/p>", "typst": "The checks report $phi = 0 degree$ and $180 degree$ as states the construction does not cover: there $M$ lies on $C S$ and the perpendicular $M P$ has no direction. Euler\\'s value at $A$ and $B$ is the value of the formula there."}], "la": {"html": "<p><strong>29.<\/strong> Ponamus nunc particulam <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>M<\/mi><annotation encoding=\"application/x-tex\">M<\/annotation><\/semantics><\/math> in ipsa Terrae superficie esse constitutam, eritque <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msqrt><mrow><mo stretchy=\"false\" form=\"prefix\">(<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\" form=\"postfix\">)<\/mo><\/mrow><\/msqrt><mo>=<\/mo><mn>1<\/mn><\/mrow><annotation encoding=\"application/x-tex\">\\sqrt{(x^2 + y^2)} = 1<\/annotation><\/semantics><\/math> ob Terrae semidiametrum <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mn>1<\/mn><\/mrow><annotation encoding=\"application/x-tex\">= 1<\/annotation><\/semantics><\/math>. Quare si particula <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>M<\/mi><annotation encoding=\"application/x-tex\">M<\/annotation><\/semantics><\/math> <span class=\"ax-pb\" title=\"here page 39 begins\">|39|<\/span> fuerit posita in <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>M<\/mi><annotation encoding=\"application/x-tex\">M<\/annotation><\/semantics><\/math>, existente anguli <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mi>C<\/mi><mi>M<\/mi><\/mrow><annotation encoding=\"application/x-tex\">ACM<\/annotation><\/semantics><\/math> sinu <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mi>y<\/mi><\/mrow><annotation encoding=\"application/x-tex\">= y<\/annotation><\/semantics><\/math> et cosinu <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mi>x<\/mi><\/mrow><annotation encoding=\"application/x-tex\">= x<\/annotation><\/semantics><\/math>, eius gravitas naturalis acceleratrix a Sole Lunave in <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>S<\/mi><annotation encoding=\"application/x-tex\">S<\/annotation><\/semantics><\/math> augebitur vi <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mfrac><mrow><mi>S<\/mi><mo stretchy=\"false\" form=\"prefix\">(<\/mo><mi>y<\/mi><mi>y<\/mi><mo>−<\/mo><mn>2<\/mn><mi>x<\/mi><mi>x<\/mi><mo stretchy=\"false\" form=\"postfix\">)<\/mo><\/mrow><msup><mi>a<\/mi><mn>3<\/mn><\/msup><\/mfrac><\/mrow><annotation encoding=\"application/x-tex\">= \\frac{S(yy - 2xx)}{a^3}<\/annotation><\/semantics><\/math>, secundum horizontem autem in directione <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M<\/mi><mi>R<\/mi><\/mrow><annotation encoding=\"application/x-tex\">MR<\/annotation><\/semantics><\/math> urgebitur vi <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mfrac><mrow><mn>3<\/mn><mi>S<\/mi><mi>x<\/mi><mi>y<\/mi><\/mrow><msup><mi>a<\/mi><mn>3<\/mn><\/msup><\/mfrac><\/mrow><annotation encoding=\"application/x-tex\">= \\frac{3Sxy}{a^3}<\/annotation><\/semantics><\/math>. Gravitas igitur maxime augebitur, si particula <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>M<\/mi><annotation encoding=\"application/x-tex\">M<\/annotation><\/semantics><\/math> posita fuerit in <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>D<\/mi><annotation encoding=\"application/x-tex\">D<\/annotation><\/semantics><\/math> vel <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>E<\/mi><annotation encoding=\"application/x-tex\">E<\/annotation><\/semantics><\/math>, quibus in locis punctum <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>S<\/mi><annotation encoding=\"application/x-tex\">S<\/annotation><\/semantics><\/math> in horizonte apparet; ibi vero gravitatis augmentum erit <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mfrac><mi>S<\/mi><msup><mi>a<\/mi><mn>3<\/mn><\/msup><\/mfrac><\/mrow><annotation encoding=\"application/x-tex\">= \\frac{S}{a^3}<\/annotation><\/semantics><\/math>. In punctis autem <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>A<\/mi><annotation encoding=\"application/x-tex\">A<\/annotation><\/semantics><\/math> et <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>B<\/mi><annotation encoding=\"application/x-tex\">B<\/annotation><\/semantics><\/math>, quae punctum <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>S<\/mi><annotation encoding=\"application/x-tex\">S<\/annotation><\/semantics><\/math> vel in suo zenith vel nadir positum habent, maximum deprehendetur gravitatis decrementum, quod scilicet erit <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mfrac><mrow><mn>2<\/mn><mi>S<\/mi><\/mrow><msup><mi>a<\/mi><mn>3<\/mn><\/msup><\/mfrac><\/mrow><annotation encoding=\"application/x-tex\">= \\frac{2S}{a^3}<\/annotation><\/semantics><\/math>: ita ut maximum gravitatis decrementum duplo maius sit quam maximum incrementum. Vis autem horizontalis <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mrow><mn>3<\/mn><mi>S<\/mi><mi>x<\/mi><mi>y<\/mi><\/mrow><msup><mi>a<\/mi><mn>3<\/mn><\/msup><\/mfrac><annotation encoding=\"application/x-tex\">\\frac{3Sxy}{a^3}<\/annotation><\/semantics><\/math> maxima evadet, si angulus <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mi>C<\/mi><mi>M<\/mi><\/mrow><annotation encoding=\"application/x-tex\">ACM<\/annotation><\/semantics><\/math> fuerit semirectus, id quod accidit in iis Terrae regionibus, in quibus punctum <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>S<\/mi><annotation encoding=\"application/x-tex\">S<\/annotation><\/semantics><\/math> conspicitur vel 45° gradibus supra horizontem elevatum, vel tantundem sub horizonte depressum latet: his igitur casibus ob <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mi>y<\/mi><mo>=<\/mo><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><\/mrow><annotation encoding=\"application/x-tex\">xy = \\frac{1}{2}<\/annotation><\/semantics><\/math> fiet vis horizontalis <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mfrac><mrow><mn>3<\/mn><mi>S<\/mi><\/mrow><mrow><mn>2<\/mn><msup><mi>a<\/mi><mn>3<\/mn><\/msup><\/mrow><\/mfrac><\/mrow><annotation encoding=\"application/x-tex\">= \\frac{3S}{2a^3}<\/annotation><\/semantics><\/math>. Huius ergo vis effectus in hoc consistet, ut directio gravitatis mutetur, atque versus rectam <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>S<\/mi><mi>C<\/mi><\/mrow><annotation encoding=\"application/x-tex\">SC<\/annotation><\/semantics><\/math> inclinetur angulo cuius tangens est <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mfrac><mrow><mn>3<\/mn><mi>S<\/mi><\/mrow><mrow><mn>2<\/mn><msup><mi>a<\/mi><mn>3<\/mn><\/msup><\/mrow><\/mfrac><\/mrow><annotation encoding=\"application/x-tex\">= \\frac{3S}{2a^3}<\/annotation><\/semantics><\/math>, existente sinu toto <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mn>1<\/mn><\/mrow><annotation encoding=\"application/x-tex\">= 1<\/annotation><\/semantics><\/math>, quia gravitatem unitate designamus.<\/p>", "typst": "#strong[\\29.] Ponamus nunc particulam $M$ in ipsa Terrae superficie esse constitutam, eritque $sqrt(\\(x^2 + y^2\\)) = 1$ ob Terrae semidiametrum $= 1$. Quare si particula $M$ #emph[|39|] fuerit posita in $M$, existente anguli $A C M$ sinu $= y$ et cosinu $= x$, eius gravitas naturalis acceleratrix a Sole Lunave in $S$ augebitur vi $= frac(S\\(y y - 2 x x\\), a^3)$, secundum horizontem autem in directione $M R$ urgebitur vi $= frac(3 S x y, a^3)$. Gravitas igitur maxime augebitur, si particula $M$ posita fuerit in $D$ vel $E$, quibus in locis punctum $S$ in horizonte apparet; ibi vero gravitatis augmentum erit $= S / a^3$. In punctis autem $A$ et $B$, quae punctum $S$ vel in suo zenith vel nadir positum habent, maximum deprehendetur gravitatis decrementum, quod scilicet erit $= frac(2 S, a^3)$: ita ut maximum gravitatis decrementum duplo maius sit quam maximum incrementum. Vis autem horizontalis $frac(3 S x y, a^3)$ maxima evadet, si angulus $A C M$ fuerit semirectus, id quod accidit in iis Terrae regionibus, in quibus punctum $S$ conspicitur vel 45° gradibus supra horizontem elevatum, vel tantundem sub horizonte depressum latet: his igitur casibus ob $x y = 1 / 2$ fiet vis horizontalis $= frac(3 S, 2 a^3)$. Huius ergo vis effectus in hoc consistet, ut directio gravitatis mutetur, atque versus rectam $S C$ inclinetur angulo cuius tangens est $= frac(3 S, 2 a^3)$, existente sinu toto $= 1$, quia gravitatem unitate designamus."}, "en": {"html": "<p><strong>29.<\/strong> Let us now assume that the particle <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>M<\/mi><annotation encoding=\"application/x-tex\">M<\/annotation><\/semantics><\/math> is situated on the very surface of the Earth, and we will have <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msqrt><mrow><mo stretchy=\"false\" form=\"prefix\">(<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\" form=\"postfix\">)<\/mo><\/mrow><\/msqrt><mo>=<\/mo><mn>1<\/mn><\/mrow><annotation encoding=\"application/x-tex\">\\sqrt{(x^2 + y^2)} = 1<\/annotation><\/semantics><\/math> because of the Earth's semidiameter <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mn>1<\/mn><\/mrow><annotation encoding=\"application/x-tex\">= 1<\/annotation><\/semantics><\/math>. <span class=\"ax-corr\" title=\"corrected against the Latin: one sentence over the page break; Latin: Quare si particula M fuerit posita in M\">Therefore, if the particle <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>M<\/mi><annotation encoding=\"application/x-tex\">M<\/annotation><\/semantics><\/math> <span class=\"ax-pb\" title=\"here page 39 begins\">|39|<\/span> is placed at <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>M<\/mi><annotation encoding=\"application/x-tex\">M<\/annotation><\/semantics><\/math>, with<\/span> the sine of the angle <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mi>C<\/mi><mi>M<\/mi><\/mrow><annotation encoding=\"application/x-tex\">ACM<\/annotation><\/semantics><\/math> being <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mi>y<\/mi><\/mrow><annotation encoding=\"application/x-tex\">= y<\/annotation><\/semantics><\/math> and the cosine <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mi>x<\/mi><\/mrow><annotation encoding=\"application/x-tex\">= x<\/annotation><\/semantics><\/math>, its natural accelerating gravity from the Sun or Moon at <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>S<\/mi><annotation encoding=\"application/x-tex\">S<\/annotation><\/semantics><\/math> will be increased by the force <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mfrac><mrow><mi>S<\/mi><mo stretchy=\"false\" form=\"prefix\">(<\/mo><mi>y<\/mi><mi>y<\/mi><mo>−<\/mo><mn>2<\/mn><mi>x<\/mi><mi>x<\/mi><mo stretchy=\"false\" form=\"postfix\">)<\/mo><\/mrow><msup><mi>a<\/mi><mn>3<\/mn><\/msup><\/mfrac><\/mrow><annotation encoding=\"application/x-tex\">= \\frac{S(yy - 2xx)}{a^3}<\/annotation><\/semantics><\/math>, while along the horizon in the direction <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M<\/mi><mi>R<\/mi><\/mrow><annotation encoding=\"application/x-tex\">MR<\/annotation><\/semantics><\/math> it will be urged by the force <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mfrac><mrow><mn>3<\/mn><mi>S<\/mi><mi>x<\/mi><mi>y<\/mi><\/mrow><msup><mi>a<\/mi><mn>3<\/mn><\/msup><\/mfrac><\/mrow><annotation encoding=\"application/x-tex\">= \\frac{3Sxy}{a^3}<\/annotation><\/semantics><\/math>. Therefore, gravity will be increased the most if the particle <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>M<\/mi><annotation encoding=\"application/x-tex\">M<\/annotation><\/semantics><\/math> is placed at <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>D<\/mi><annotation encoding=\"application/x-tex\">D<\/annotation><\/semantics><\/math> or <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>E<\/mi><annotation encoding=\"application/x-tex\">E<\/annotation><\/semantics><\/math>, in which places the point <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>S<\/mi><annotation encoding=\"application/x-tex\">S<\/annotation><\/semantics><\/math> appears on the horizon; there, indeed, the increase of gravity will be <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mfrac><mi>S<\/mi><msup><mi>a<\/mi><mn>3<\/mn><\/msup><\/mfrac><\/mrow><annotation encoding=\"application/x-tex\">= \\frac{S}{a^3}<\/annotation><\/semantics><\/math>. But at points <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>A<\/mi><annotation encoding=\"application/x-tex\">A<\/annotation><\/semantics><\/math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>B<\/mi><annotation encoding=\"application/x-tex\">B<\/annotation><\/semantics><\/math>, which have the point <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>S<\/mi><annotation encoding=\"application/x-tex\">S<\/annotation><\/semantics><\/math> placed either in their zenith or nadir, the greatest decrease of gravity will be detected, which will namely be <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mfrac><mrow><mn>2<\/mn><mi>S<\/mi><\/mrow><msup><mi>a<\/mi><mn>3<\/mn><\/msup><\/mfrac><\/mrow><annotation encoding=\"application/x-tex\">= \\frac{2S}{a^3}<\/annotation><\/semantics><\/math>: so that the maximum decrease of gravity is twice as great as the maximum increase. Moreover, the horizontal force <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mrow><mn>3<\/mn><mi>S<\/mi><mi>x<\/mi><mi>y<\/mi><\/mrow><msup><mi>a<\/mi><mn>3<\/mn><\/msup><\/mfrac><annotation encoding=\"application/x-tex\">\\frac{3Sxy}{a^3}<\/annotation><\/semantics><\/math> will become greatest if the angle <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mi>C<\/mi><mi>M<\/mi><\/mrow><annotation encoding=\"application/x-tex\">ACM<\/annotation><\/semantics><\/math> is a semi-right angle, which happens in those regions of the Earth in which the point <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>S<\/mi><annotation encoding=\"application/x-tex\">S<\/annotation><\/semantics><\/math> is seen either elevated 45 degrees above the horizon, or lies hidden depressed by the same amount below the horizon: in these cases, therefore, because of <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mi>y<\/mi><mo>=<\/mo><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><\/mrow><annotation encoding=\"application/x-tex\">xy = \\frac{1}{2}<\/annotation><\/semantics><\/math>, the horizontal force will become <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mfrac><mrow><mn>3<\/mn><mi>S<\/mi><\/mrow><mrow><mn>2<\/mn><msup><mi>a<\/mi><mn>3<\/mn><\/msup><\/mrow><\/mfrac><\/mrow><annotation encoding=\"application/x-tex\">= \\frac{3S}{2a^3}<\/annotation><\/semantics><\/math>. The effect of this force, therefore, will consist in this, that the direction of gravity is changed, and is inclined towards the straight line <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>S<\/mi><mi>C<\/mi><\/mrow><annotation encoding=\"application/x-tex\">SC<\/annotation><\/semantics><\/math> by an angle whose tangent is <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mfrac><mrow><mn>3<\/mn><mi>S<\/mi><\/mrow><mrow><mn>2<\/mn><msup><mi>a<\/mi><mn>3<\/mn><\/msup><\/mrow><\/mfrac><\/mrow><annotation encoding=\"application/x-tex\">= \\frac{3S}{2a^3}<\/annotation><\/semantics><\/math>, the total sine being <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mn>1<\/mn><\/mrow><annotation encoding=\"application/x-tex\">= 1<\/annotation><\/semantics><\/math>, since we designate gravity by unity.<\/p>", "typst": "#strong[\\29.] Let us now assume that the particle $M$ is situated on the very surface of the Earth, and we will have $sqrt(\\(x^2 + y^2\\)) = 1$ because of the Earth\\'s semidiameter $= 1$. Therefore, if the particle $M$ #emph[|39|] is placed at $M$, with the sine of the angle $A C M$ being $= y$ and the cosine $= x$, its natural accelerating gravity from the Sun or Moon at $S$ will be increased by the force $= frac(S\\(y y - 2 x x\\), a^3)$, while along the horizon in the direction $M R$ it will be urged by the force $= frac(3 S x y, a^3)$. Therefore, gravity will be increased the most if the particle $M$ is placed at $D$ or $E$, in which places the point $S$ appears on the horizon; there, indeed, the increase of gravity will be $= S / a^3$. But at points $A$ and $B$, which have the point $S$ placed either in their zenith or nadir, the greatest decrease of gravity will be detected, which will namely be $= frac(2 S, a^3)$: so that the maximum decrease of gravity is twice as great as the maximum increase. Moreover, the horizontal force $frac(3 S x y, a^3)$ will become greatest if the angle $A C M$ is a semi-right angle, which happens in those regions of the Earth in which the point $S$ is seen either elevated 45 degrees above the horizon, or lies hidden depressed by the same amount below the horizon: in these cases, therefore, because of $x y = 1 / 2$, the horizontal force will become $= frac(3 S, 2 a^3)$. The effect of this force, therefore, will consist in this, that the direction of gravity is changed, and is inclined towards the straight line $S C$ by an angle whose tangent is $= frac(3 S, 2 a^3)$, the total sine being $= 1$, since we designate gravity by unity."}}], "argument": {"format": "astra-argument/1", "notation": "astra/1", "id": "euler-tide-force-resolution", "address": "fr:astra/euler-tide-force-resolution", "title": "The tide-raising force along and across the vertical, to first order in the earth's size over the luminary's distance", "author": "Gerd Graßhoff", "witness": [{"address": "fr:enestroem/E57/0016/p01", "note": "§24"}, {"address": "fr:enestroem/E57/0017/p03", "note": "§26: the exact components"}, {"address": "fr:enestroem/E57/0018/p07", "note": "§27: the two components to first order"}], "attributed": ["Leonhard Euler"], "context": {"id": "euler-tide-force", "kind": "model", "title": "Euler's geometry of the tide-raising force", "address": "fr:astra/euler-tide-force"}, "check": {"level": "conclusive", "complete": true, "levels": ["well-formed", "grounded", "true", "justified", "conclusive"], "passed": ["well-formed", "grounded", "true", "justified", "conclusive"], "failures": {}}, "model": [{"prefix": "", "id": "euler-tide-force", "address": "fr:astra/euler-tide-force", "title": "Euler's geometry of the tide-raising force", "attributed": "Leonhar function transport(el, ctl, bundle) {

    if (box) box.innerHTML = `<b>${esc(n.number)}</b> ${esc(n.claim)}${n.notation && n.notation !== n.claim ? ` — <span class="aa-not">${esc(n.notation)}</span>` : ''}`;
    this.dispatchEvent(new CustomEvent('step-select', { detail: { id: n.id, number: n.number }, bubbles: true }));
  }
  _path(id) {
    let found = null;
    const walk = (n, trail) => { const t = trail.concat(n); if (n.id === id) found = t; (n.children || []).forEach(c => walk(c, t)); };
    (this._data.argument || []).forEach(n => walk(n, []));
    return found || [];
  }

  // ── rendering ──
  _render() {
    const d = this._data;
    const who = [];
    if ((d.attributed || []).length) who.push(`model of <b>${esc(d.attributed.join(', '))}</b>`);
    (d.witness || []).slice(0, 2).forEach(w => who.push(`witness <b>${esc(w.note || w.address)}</b>`));
    if (d.author) who.push(`reconstruction <b>${esc(d.author)}</b>`);
    const lv = d.check.levels.slice(1).map(l => `<span class="${d.check.passed.includes(l) ? 'ok' : 'no'}">${esc(l)}</span>`).join('');
    this.innerHTML = `<div class="aa" data-depth="${this._depth}">
      <div class="aa-head"><p class="aa-kicker">Argument · in ${esc(d.context.kind)} ${esc(d.context.title)}</p>
        <h2 class="aa-title">${esc(d.title)}</h2><p class="aa-who">${who.join(' · ')}</p></div>
      <div class="aa-bar"><div class="aa-depth" role="group" aria-label="depth of display">
          ${['overview', 'steps', 'full'].map(x => `<button type="button" data-depth="${x}" aria-pressed="${x === this._depth}">${x[0].toUpperCase() + x.slice(1)}</button>`).join('')}
        </div><div class="aa-levels" title="what the checks say of this argument">${lv}</div></div>
      <div class="aa-grid"><div class="aa-fig"></div><div class="aa-outline"></div></div></div>`;
    this.querySelector('.aa-depth').addEventListener('click', e => { const b = e.target.closest('button[data-depth]'); if (b) this.setDepth(b.dataset.depth); });
    this._renderFigure();
    this._renderOutline();
    this._fit();
    const m = (location.hash || '').match(/step=([^&]+)/);
    if (m) this.select(decodeURIComponent(m[1]));
  }

  _renderFigure() {
    const d = this._data, root = this.querySelector('.aa'), box = this.querySelector('.aa-fig');
    if (!d.figure || this.getAttribute('figure') === 'off') { root.classList.add('aa-nofig'); return; }
    const drawn = Object.entries(d.figure.drawn || {});
    box.innerHTML = `${d.figure.svg}<div class="aa-transport"></div>
      <p class="aa-selected">Select a step to see in the figure what it speaks of.</p>
      ${drawn.length ? `<p class="aa-fig-note">Drawn with ${esc(drawn.map(([k, v]) => `${k} = ${v}`).join(', '))}: drawing values, not attested ones.</p>` : ''}`;
    const svg = box.querySelector('svg');
    try { this._ctl = mount(svg, d.figure.bundle, { transport: box.querySelector('.aa-transport'), autoplay: false }); }
    catch (e) { this._ctl = null; }
  }

  _refs(n) {
    if (!(n.from || []).length) return '';
    return `<span class="aa-from">from ${n.from.map(p => p.kind === 'step' || p.kind === 'hypothesis'
      ? `<button type="button" class="aa-ref" data-ref="${esc(p.ref)}" aria-label="premise ${esc(p.label)}">${esc(p.label)}</button>`

  _node(n, level) {
    const kids = n.children || [];
    const open = this._open.has(n.id), det = this._detail.has(n.id);

    const when = n.when ? `<span class="aa-when">when ${esc(n.when.join('; '))}</span>` : '';

    const sub = (notation || when || (n.from || []).length) ? `<div class="aa-sub">${when}${notation}${this._refs(n)}</div>` : '';
    const tag = n.kind === 'case' ? '<span class="aa-case-tag">Case</span>' : n.kind === 'supposition' ? '<span class="aa-case-tag">Suppose</span>' : '';
    const dist = n.distinction && open ? `<p class="aa-distinction">Argued ${esc(n.distinction)}.</p>` : '';
    return `<div class="aa-node aa-kind-${n.kind}${this._selected === n.id ? ' is-selected' : ''}" data-id="${esc(n.id)}" data-level="${level}">
      <div class="aa-row">
        ${kids.length ? `<button type="button" class="aa-tog" aria-expanded="${open}" aria-label="${open ? 'Close' : 'Open'} ${esc(n.number)}"><span class="aa-chev">▸</span></button>` : '<span></span>'}
        <span class="aa-num">${esc(n.number)}</span>
        <div class="aa-main"><button type="button" class="aa-select aa-claim" aria-label="${esc(n.number)}: ${esc(n.claim)}. Show it in the figure">${tag}${esc(n.claim)}</button>${sub}</div>
        <span class="aa-rule">${n.by ? esc(n.by.rule) : ''}</span>
        <span class="aa-mark${markCls}" title="${esc(n.status)}: ${esc(STATUS_TITLE[n.status] || '')}">${esc(n.mark)}</span>

  _detailHtml(n) {
    const rows = [];
    rows.push(['status', `${esc(n.status)}${n.note ? ` — ${esc(n.note)}` : ''}`]);
    if (n.by && n.by.statement) rows.push(['rule', `<q>${esc(n.by.statement)}</q>${n.by.printed ? ` Heath, ${esc(n.by.printed)}.` : ''}${n.by.case ? ` Case used: ${esc(n.by.case)}.` : ''}${n.by.rests_on ? ` Rests on ${esc(n.by.rests_on)}.` : ''}`]);
    if (n.binding) rows.push(['binding', esc(Object.entries(n.binding).map(([k, v]) => `${k} = ${v}`).join(', '))]);
    if (n.conditions) rows.push(['the figure supplies', esc(n.conditions.join('; '))]);
    if (n.degenerate_at) rows.push(['degenerate at', `<span class="aa-warn">${esc(n.degenerate_at.join(', '))}</span>`]);
    if (n.undefined_at) rows.push(['undefined at', esc(n.undefined_at.join(', '))]);
    if (n.equal_at) rows.push(['equal, not less, at', esc(n.equal_at.join(', '))]);
    if (n.needs) rows.push(['needs', esc(n.needs.join(', '))]);
    rows.push(['formal', `<span class="aa-formal">${esc(n.formal)}</span>`]);
    if (typeof n.residual === 'number' && n.grade !== 'approximation' && !n.formal.startsWith('less(')) rows.push(['residual', n.residual.toExponential(1)]);
    return `<div class="aa-detail"><dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl></div>`;
  }

  _band(key, title, hint, body) {
    const open = this._bands.has(key);
    return `<section class="aa-band" data-band="${key}"><button type="button" class="aa-band-h" aria-expanded="${open}"><span class="aa-chev">▸</span>${esc(title)} <small>${hint}</small></button>
      <div class="aa-band-b"${open ? '' : ' hidden'}>${body}</div></section>`;
  }

  _modelHtml() {
    const d = this._data;
    const dl = (title, items, f) => items.length ? `<div class="aa-group">${title}</div>` + items.map(f).join('') : '';
    return d.model.map(m => `<div class="aa-member"><h4>${m.prefix ? esc(m.prefix) + ' — ' : ''}${esc(m.title)} <small>${m.attributed ? 'of ' + esc(m.attributed) : ''}</small></h4>
      <dl class="aa-defs">
        ${dl('parameters', m.parameters, p => `<dt>${sym(p.symbol)}</dt><dd>${esc(p.meaning)}${p.range ? ` <code class="aa-def">${esc(p.unit)}, in ${esc(p.range)}</code>` : ''}</dd>`)}
        ${dl('what varies', m.variables, v => `<dt>${sym(v.symbol)}</dt><dd>${esc(v.meaning)}${v.law ? ` <code class="aa-def">${esc(v.law)}</code>` : ''}</dd>`)}
        ${dl('construction', m.objects, o => `<dt>${sym(o.symbol)}</dt><dd>${esc(o.meaning)} <code class="aa-def">${esc(o.defined_by)}</code></dd>`)}
        ${dl('what is observed', m.observables, o => `<dt>${sym(o.symbol)}</dt><dd>${esc(o.meaning)} <code class="aa-def">${esc(o.defined_by)}</code></dd>`)}
      </dl></div>`).join('')
      + ((d.identified || []).length ? `<p class="aa-fig-note">In one plane, with ${esc(d.identified.map(i => i.meaning || i.name).join(', '))}.</p>` : '');
  }

  _renderOutline() {
    const d = this._data, out = this.querySelector('.aa-outline');

    this.querySelector('.aa').dataset.depth = this._depth;
    this.querySelectorAll('.aa-depth button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.depth === this._depth)));
    const nObj = d.model.reduce((a, m) => a + m.objects.length, 0);
    let html = this._band('model', 'Model', `${d.model.length > 1 ? d.model.length + ' models superposed, ' : ''}${nObj} constructed objects`, this._modelHtml());
    if ((d.hypotheses || []).length || (d.constructions || []).length) {
      const g = (d.hypotheses || []).map(h => `<div class="aa-node" data-id="${esc(h.id)}"><div class="aa-row"><span></span><span class="aa-num">${esc(h.number)}</span>
          <div class="aa-main"><div class="aa-claim">${esc(h.claim)}</div><div class="aa-sub"><span class="aa-not">${esc(h.notation)}</span></div></div><span></span><span></span><span></span></div></div>`).join('')
        + (d.constructions || []).map(c => `<div class="aa-node"><div class="aa-row"><span></span><span class="aa-num">${esc(c.symbol)}</span>
          <div class="aa-main"><div class="aa-claim">${esc(c.meaning)}</div><div class="aa-sub"><span class="aa-not">${esc(c.defined_by)}</span></div></div><span class="aa-rule">auxiliary construction</span><span></span><span></span></div></div>`).join('');
      html += this._band('given', 'Given', [(d.hypotheses || []).length ? plural(d.hypotheses.length, 'hypothesis', 'hypotheses') : '', (d.constructions || []).length ? plural(d.constructions.length, 'auxiliary construction', 'auxiliary constructions') : ''].filter(Boolean).join(', '), g);
    }
    const all = this._nodes();
    html += this._band('argument', 'Argument', `${plural(all.filter(n => n.kind === 'step').length, 'step', 'steps')} in ${plural(all.filter(n => n.kind === 'sub-argument' || n.kind === 'case').length, 'block', 'blocks')}`, d.argument.map(n => this._node(n, 0)).join(''));
    const concl = [d.conclusion].concat(d.further_conclusions || []).filter(Boolean);
    if (concl.length) html += this._band('therefore', 'Therefore', d.equivalence ? `the two models are equivalent in ${esc(d.equivalence.in)}` : '', `<div class="aa-therefore">${concl.map(n => this._node(n, 0)).join('')}</div>`);
    const c = d.checks, st = Object.entries(c.by_status || {}).map(([k, v]) => `${v} ${esc(k)}`).join(', ');
    const comp = (d.computations || []).length ? `<table class="aa-comp"><tr><th>computed</th><th>value</th><th>reported</th><th></th></tr>${d.computations.map(x =>
      `<tr><td>${esc(x.meaning || x.name)}</td><td>${esc(x.value || '—')}</td><td>${esc(x.reported || '—')}</td><td>${esc(x.verdict)}${x.difference && x.verdict === 'discrepancy' ? ' ' + esc(x.difference) : ''}</td></tr>`).join('')}</table>` : '';
    html += this._band('checks', 'What the checks say', `${esc(d.check.level)}`, `<div class="aa-checks">
      <div class="aa-legend">${LEGEND.map(([m, t]) => `<span><b>${m}</b>${t}</span>`).join('')}</div>
      <p>${c.steps} steps: ${st}. Tested in ${c.configurations} configurations of the parameter space and the states.</p>
      ${(c.degenerate_states || []).length ? `<p>Degenerate states not covered: ${esc(c.degenerate_states.join(', '))}.</p>` : '<p>No state is left uncovered.</p>'}
      ${Object.keys(d.check.failures || {}).length ? `<ul>${Object.entries(d.check.failures).map(([k, v]) => v.map(x => `<li class="aa-warn"><b>${esc(k)}</b>: ${esc(x)}</li>`).join('')).join('')}</ul>` : ''}
      ${(c.notes || []).length ? `<ul>${c.notes.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}${comp}</div>`);
    out.innerHTML = html;
    if (!this._wired) { this._wire(); this._wired = true; }
  }

  _wire() {
    this.addEventListener('click', e => {
      const bandH = e.target.closest('.aa-band-h');
      if (bandH) { const k = bandH.parentElement.dataset.band; this._bands.has(k) ? this._bands.delete(k) : this._bands.add(k); this._renderOutline(); return; }
      const node = e.target.closest('.aa-node'); if (!node || !node.dataset.id) return;
      const id = node.dataset.id;
      const ref = e.target.closest('.aa-ref[data-ref]');
      if (ref) { this.select(ref.dataset.ref); const t = this.querySelector(`.aa-node[data-id="${CSS.escape(ref.dataset.ref)}"]`); if (t) t.scrollIntoView({ block: 'nearest' }); return; }
      if (e.target.closest('.aa-tog')) { this._open.has(id) ? this._open.delete(id) : this._open.add(id); this._renderOutline(); this._focus(id, '.aa-tog'); return; }
      if (e.target.closest('.aa-more')) { this._detail.has(id) ? this._detail.delete(id) : this._detail.add(id); this._renderOutline(); this._focus(id, '.aa-more'); return; }
      if (e.target.closest('.aa-select')) { this.select(id); this._focus(id, '.aa-select'); }
    });
    const cite = (e, on) => { const r = e.target.closest && e.target.closest('.aa-ref[data-ref]'); if (!r) return;
      const t = this.querySelector(`.aa-node[data-id="${CSS.escape(r.dataset.ref)}"]`); if (t) t.classList.toggle('is-cited', on); };
    this.addEventListener('mouseover', e => cite(e, true));
    this.addEventListener('mouseout', e => cite(e, false));
    this.addEventListener('focusin', e => cite(e, true));
    this.addEventListener('focusout', e => cite(e, false));
  }
  _focus(id, sel) { const el = this.querySelector(`.aa-node[data-id="${CSS.escape(id)}"] > .aa-row ${sel}`); if (el) el.focus({ preventScroll: true }); }
  _fit() { const root = this.querySelector('.aa'); if (root) root.classList.toggle('aa-narrow', this.clientWidth < 820); }
}

if (!customElements.get('astra-argument')) customElements.define('astra-argument', AstraArgument);

const mountFigure = mount, ArgumentElement = AstraArgument;
// <astra-exposition> — one segment of a historical source taken through its argument (astra-exposition/1).
//
//   <astra-exposition src="exposition.json"></astra-exposition>      or     el.data = {...}
//
// The page is a table of passages. Each row sets the source beside its reconstruction:
//
//   Source (Latin · English)   |   Reconstruction (Overview · Steps · Full)   |   Notes (optional)
//
// Above the rows a compact figure stays in view; selecting a step shows in it what the step speaks of. Every
// passage carries its reference and one action, "Open in the edition", which opens the page of the source in the
// edition's viewer in a separate window (always the same one).
//
// The element extends <astra-argument>: steps, sub-arguments, details and status marks are drawn by the same code.
//
// Attributes: src; viewer-base (the address of the edition's viewer; default: the one named in the document).
// Methods: select(id), setDepth(d), setLanguage('la' | 'en'), setNotes(bool), setFigure(bool).
// Events: `step-select`, `depth-change`, `view-change`. Deep link: #lang=en&notes=1&depth=steps&step=<id>.


const xesc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const xsym = s => { const t = xesc(s), i = t.indexOf('_'); return i < 0 ? t : `${t.slice(0, i)}<sub>${t.slice(i + 1)}</sub>`; };
const LANGS = [['la', 'Latin'], ['en', 'English']];
const DEPTHS = [['overview', 'Overview'], ['steps', 'Steps'], ['full', 'Full']];
const XLEGEND = [['✓', 'an instance of the rule named'], ['◦', 'read off the construction'], ['≈', 'by calculation or expansion'], ['?', 'true, not justified'], ['✗', 'false']];

class AstraExposition extends ArgumentElement {
  static get observedAttributes() { return ['src', 'viewer-base']; }

  constructor() {
    super();
    this._doc = null;
    this._depth = 'overview';
    this._lang = 'la';
    this._notes = false;
    this._figure = true;
  }

  set data(doc) {
    this._doc = doc;
    this._data = doc.argument;
    this._readHash();
    this._reset();
    if (this.isConnected) this._render();
  }
  get data() { return this._doc; }

  attributeChangedCallback(name, old, value) {

    if (name === 'src' && value) this._load(value);
    if (name === 'viewer-base' && this._doc) this._renderOutline();
  }

  // ── the view: language, notes, figure, depth ──
  _readHash() {
    const q = new URLSearchParams((location.hash || '').replace(/^#/, ''));
    if (q.get('lang') === 'en' || q.get('lang') === 'la') this._lang = q.get('lang');
    if (q.has('notes')) this._notes = q.get('notes') === '1';
    if (q.has('figure')) this._figure = q.get('figure') !== '0';
    if (['overview', 'steps', 'full'].includes(q.get('depth'))) this._depth = q.get('depth');
  }
  _writeHash() {
    const q = new URLSearchParams();
    if (this._lang !== 'la') q.set('lang', this._lang);
    if (this._notes) q.set('notes', '1');
    if (!this._figure) q.set('figure', '0');
    if (this._depth !== 'overview') q.set('depth', this._depth);
    if (this._selected) q.set('step', this._selected);

  }
  _view() {
    const root = this.querySelector('.ax');
    if (!root) return;
    root.dataset.lang = this._lang;
    root.dataset.notes = this._notes ? 'on' : 'off';
    root.dataset.figure = this._figure ? 'on' : 'off';
    root.dataset.depth = this._depth;
    this.querySelectorAll('.ax-lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === this._lang)));
    this.querySelectorAll('.ax-depth button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.depth === this._depth)));
    const n = this.querySelector('.ax-notes-toggle'); if (n) n.setAttribute('aria-pressed', String(this._notes));
    const f = this.querySelector('.ax-figure-toggle'); if (f) f.setAttribute('aria-pressed', String(this._figure));
    this._writeHash();
    this.dispatchEvent(new CustomEvent('view-change', { detail: { language: this._lang, notes: this._notes, figure: this._figure, depth: this._depth } }));
  }
  setLanguage(l) { if (l === 'la' || l === 'en') { this._lang = l; this._view(); } }
  setNotes(on) { this._notes = !!on; this._view(); }
  setFigure(on) { this._figure = !!on; this._view(); }
  setDepth(d) { super.setDepth(d); this._view(); }
  select(idOrNumber) {
    super.select(idOrNumber);
    this._writeHash();
  }

  _url(path) {
    const base = this.getAttribute('viewer-base') || this._doc.source.viewer.base || '';

  }

  // ── rendering ──
  _render() {
    const doc = this._doc, d = this._data, s = doc.source;
    const lv = d.check.levels.slice(1).map(l => `<span class="${d.check.passed.includes(l) ? 'ok' : 'no'}">${xesc(l)}</span>`).join('');
    const tr = s.translation || {};
    const engine = (tr.engines || []).map(e => `${xesc(e.model)}, ${xesc(e.date)}`).join('; ');
    this.innerHTML = `<div class="aa ax">
      <header class="aa-head ax-head">
        <p class="aa-kicker">Source and reconstruction</p>
        <h2 class="aa-title">${xesc(doc.title)}</h2>
        ${doc.subtitle ? `<p class="ax-subtitle">${xesc(doc.subtitle)}</p>` : ''}
        <p class="ax-ref"><span class="ax-ref-label">Source</span> ${s.reference} Here pp. ${xesc(s.pages)}.
          <a class="ax-open ax-open-doc" href="${xesc(this._url(s.viewer.document))}" target="famulus-source">Open the document in the edition ↗</a></p>
        ${doc.author ? `<p class="aa-who">reconstruction <b>${xesc(doc.author)}</b> · model of <b>${xesc((d.attributed || []).join(', '))}</b></p>` : ''}
      </header>
      <div class="ax-sticky">
        <div class="aa-bar ax-bar">
          <div class="ax-group"><span class="ax-group-label">Source</span>
            <div class="aa-depth ax-lang" role="group" aria-label="language of the source">${LANGS.map(([k, t]) => `<button type="button" data-lang="${k}">${t}</button>`).join('')}</div></div>
          <div class="ax-group"><span class="ax-group-label">Reconstruction</span>
            <div class="aa-depth ax-depth" role="group" aria-label="depth of the reconstruction">${DEPTHS.map(([k, t]) => `<button type="button" data-depth="${k}">${t}</button>`).join('')}</div></div>
          <button type="button" class="ax-toggle ax-notes-toggle">Notes</button>
          <button type="button" class="ax-toggle ax-figure-toggle">Figure</button>
          <div class="aa-levels" title="what the checks say of this argument">${lv}</div>
        </div>
        <div class="ax-strip">
          <div class="aa-fig"></div>
          <div class="ax-strip-side">
            <p class="aa-selected">Select a step of the reconstruction to see in the figure what it speaks of.</p>
            <div class="aa-transport"></div>
            <dl class="ax-letters"></dl>
          </div>
        </div>
      </div>
      <div class="ax-colhead" aria-hidden="true">
        <div><b>${xesc(s.short)}</b> <span class="ax-only-la">· Latin, as transcribed in the edition</span><span class="ax-only-en">· English · ${xesc(tr.status || '')}</span></div>
        <div><b>Reconstruction</b> · the same step, made explicit</div>
        <div class="ax-notes-col"><b>Notes</b></div>
      </div>
      <p class="ax-translation ax-only-en">English: ${xesc(tr.origin || '')}${engine ? ` (${engine})` : ''}. Wording corrected against the Latin is underlined; the reason shows on it.</p>
      <div class="aa-outline ax-rows"></div>
    </div>`;
    const m = (location.hash || '').match(/step=([^&]+)/);
    this._renderFigure();
    this._renderOutline();
    this._fit();
    this._view();
    if (m) this.select(decodeURIComponent(m[1]));
  }

  _renderFigure() {
    const d = this._data, root = this.querySelector('.ax'), box = this.querySelector('.aa-fig');
    if (!d.figure) { root.classList.add('ax-nofig'); this._figure = false; return; }
    box.innerHTML = d.figure.svg;
    const drawn = Object.entries(d.figure.drawn || {});
    const letters = d.model.flatMap(m => m.objects.filter(o => o.kind === 'point'));
    this.querySelector('.ax-letters').innerHTML = letters.map(o => `<div><dt>${xsym(o.symbol)}</dt><dd>${xesc(o.meaning)}</dd></div>`).join('')
      + (drawn.length ? `<p class="aa-fig-note">Drawn with ${xesc(drawn.map(([k, v]) => `${k} = ${v}`).join(', '))}: drawing values, not attested ones.</p>` : '');
    // a tall figure (a distant point far above the rest) is shown close up first; one button shows all of it
    const svg = box.querySelector('svg'), vb = (svg.getAttribute('viewBox') || '').split(/\s+/).map(Number);
    if (vb.length === 4 && vb[3] > 1.3 * vb[2]) {
      const close = `${vb[0]} ${vb[1] + vb[3] - 1.05 * vb[2]} ${vb[2]} ${1.05 * vb[2]}`, whole = vb.join(' ');
      const btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'ax-zoom';
      const set = on => { svg.setAttribute('viewBox', on ? close : whole); svg.removeAttribute('width'); svg.removeAttribute('height');
        btn.textContent = on ? 'Show the whole figure' : 'Show the figure close up'; btn.setAttribute('aria-pressed', String(!on)); this._close = on; };
      btn.addEventListener('click', () => set(!this._close));
      box.appendChild(btn); set(true);
    }
    try { this._ctl = mountFigure(box.querySelector('svg'), d.figure.bundle, { transport: this.querySelector('.aa-transport'), autoplay: false }); }
    catch (e) { this._ctl = null; }
  }

  _passage(p) {
    const d = this._data;
    const top = Object.fromEntries((d.argument || []).map(n => [n.id, n]));
    const where = `${xesc(this._doc.source.edition)}, p. ${xesc(p.pages[0])}${p.pages.length > 1 ? '–' + xesc(p.pages[p.pages.length - 1]) : ''}`;
    const active = this._selected && p.steps.some(id => this._path(this._selected).some(n => n.id === id));
    const recon = [];
    if (p.reconstruction) recon.push(`<div class="ax-prose">${p.reconstruction.html}</div>`);
    if (p.model.length) recon.push(`<dl class="aa-defs ax-defs">${p.model.map(m =>
      `<dt>${xsym(m.symbol)}</dt><dd>${xesc(m.meaning)} <code class="aa-def">${xesc(m.defined_by)}</code></dd>`).join('')}</dl>
      <p class="ax-kind">defined in the model</p>`);
    p.steps.forEach(id => { if (top[id]) recon.push(this._node(top[id], 0)); });
    if (p.see.length) recon.push(`<p class="ax-see">Read off ${p.see.map(id => top[id]
      ? `<button type="button" class="ax-see-ref" data-step="${xesc(id)}">step ${xesc(top[id].number)}</button>` : xesc(id)).join(' and ')}.</p>`);
    const corr = p.corrections.length ? `<p class="ax-corr-note">${p.corrections.length === 1 ? 'One wording' : p.corrections.length + ' wordings'} corrected against the Latin.</p>` : '';
    return `<section class="ax-row${active ? ' is-active' : ''}" data-passage="${xesc(p.id)}" id="passage-${xesc(p.id)}">
      <div class="ax-rowhead"><span class="ax-sec">${xesc(p.section)}</span><h3>${xesc(p.heading)}</h3>
        <span class="ax-where">${where}</span>
        <a class="ax-open" href="${xesc(this._url(p.viewer))}" target="famulus-source" aria-label="Open ${xesc(p.section)}, page ${xesc(p.pages[0])}, in the edition (separate window)">Open in the edition ↗</a></div>
      <div class="ax-cell ax-source">
        <div class="ax-text ax-only-la" lang="la">${p.la.html}</div>
        <div class="ax-text ax-only-en" lang="en">${p.en.html}${corr}</div>
        <p class="ax-loci">${p.loci.map(xesc).join(' · ')}</p>
      </div>
      <div class="ax-cell ax-recon">${recon.join('')}</div>
      <div class="ax-cell ax-notes">${p.notes.length ? p.notes.map(n => `<div class="ax-note">${n.html}</div>`).join('') : '<p class="ax-none">No note.</p>'}</div>
    </section>`;
  }

  _renderOutline() {
    const doc = this._doc, d = this._data, out = this.querySelector('.ax-rows');
    if (!out) return;
    let html = doc.passages.map(p => this._passage(p)).join('');
    const concl = [d.conclusion].concat(d.further_conclusions || []).filter(Boolean);
    if (concl.length) html += this._band('therefore', 'Therefore', 'what the argument establishes', `<div class="aa-therefore">${concl.map(n => this._node(n, 0)).join('')}</div>`);
    const nObj = d.model.reduce((a, m) => a + m.objects.length, 0);
    html += this._band('model', 'Model', `${nObj} constructed objects, written out`, this._modelHtml());
    const c = d.checks, st = Object.entries(c.by_status || {}).map(([k, v]) => `${v} ${xesc(k)}`).join(', ');
    html += this._band('checks', 'What the checks say', xesc(d.check.level), `<div class="aa-checks">
      <div class="aa-legend">${XLEGEND.map(([m, t]) => `<span><b>${m}</b>${t}</span>`).join('')}</div>
      <p>${c.steps} steps: ${st}. Tested in ${c.configurations} configurations of the parameter space and the states.</p>
      ${(c.degenerate_states || []).length ? `<p>Degenerate states not covered: ${xesc(c.degenerate_states.join(', '))}.</p>` : '<p>No state is left uncovered.</p>'}
      ${(c.notes || []).length ? `<ul>${c.notes.map(x => `<li>${xesc(x)}</li>`).join('')}</ul>` : ''}</div>`);
    out.innerHTML = html;
    if (!this._wired) { this._wire(); this._wireView(); this._wired = true; }
  }

  _wireView() {
    this.addEventListener('click', e => {
      const lang = e.target.closest('.ax-lang button[data-lang]');
      if (lang) { this.setLanguage(lang.dataset.lang); return; }
      const depth = e.target.closest('.ax-depth button[data-depth]');
      if (depth) { this.setDepth(depth.dataset.depth); return; }
      if (e.target.closest('.ax-notes-toggle')) { this.setNotes(!this._notes); return; }
      if (e.target.closest('.ax-figure-toggle')) { this.setFigure(!this._figure); return; }
      const see = e.target.closest('.ax-see-ref[data-step]');
      if (see) {
        this.select(see.dataset.step);
        const t = this.querySelector(`.aa-node[data-id="${CSS.escape(see.dataset.step)}"]`);
        if (t) t.scrollIntoView({ block: 'center', behavior: 'smooth' });
        return;
      }
      const open = e.target.closest('a.ax-open');
      if (open) { e.preventDefault(); window.open(open.href, 'famulus-source'); }
    });
  }

  _fit() { const root = this.querySelector('.ax'); if (root) root.classList.toggle('ax-narrow', this.clientWidth < 900); }
}

if (!customElements.get('astra-exposition')) customElements.define('astra-exposition', AstraExposition);

}
})();

</script>

  document.getElementById('exp').data = JSON.parse(document.getElementById('astra-exposition-data').textContent);
</script>

, S) - (direction(M, C) + 90°))", "group": "observables"}], "corrections": [], "notes": [{"html": "<p>Everything that follows computes this difference. A particle is moved relative to the earth only by what the luminary does to it over and above what it does to the centre.<\/p>", "typst": "Everything that follows computes this difference. A particle is moved relative to the earth only by what the luminary does to it over and above what it does to the centre."}], "la": {"html": "<p>Cum autem iste motus, qui in singulis Terrae partibus generatur, a differentia inter vires centrum Terrae et ipsas partes sollicitantes proficiscatur, propria vis, qua quaeque particula agitabitur, innotescet, si a vi acceleratrice illam particulam sollicitante auferatur vis acceleratrix, quam centrum Terrae patitur: haecque subtractio ita instituitur, ut cuique particulae praeter vim actu eam sollicitantem alia vis aequalis illi, quam centrum patitur, in directione contraria applicata concipiatur: tum enim vis quae ex compositione harum duarum oritur, erit vera vis particulam illam de loco suo deflectens.<\/p>", "typst": "Cum autem iste motus, qui in singulis Terrae partibus generatur, a differentia inter vires centrum Terrae et ipsas partes sollicitantes proficiscatur, propria vis, qua quaeque particula agitabitur, innotescet, si a vi acceleratrice illam particulam sollicitante auferatur vis acceleratrix, quam centrum Terrae patitur: haecque subtractio ita instituitur, ut cuique particulae praeter vim actu eam sollicitantem alia vis aequalis illi, quam centrum patitur, in directione contraria applicata concipiatur: tum enim vis quae ex compositione harum duarum oritur, erit vera vis particulam illam de loco suo deflectens."}, "en": {"html": "<p>Since, however, this motion, which is generated in the individual parts of the Earth, arises from the difference between the forces acting upon the center of the Earth and those acting upon the parts themselves, the proper force by which each particle is agitated will become known if the accelerating force which the center of the Earth experiences is subtracted from the accelerating force acting upon that particle: and this subtraction is performed in such a way that, in addition to the force actually acting upon each particle, another force equal to that which the center experiences, applied in the opposite direction, is conceived; for then the force which arises from the composition of these two will be the true force deflecting that particle from its place.<\/p>", "typst": "Since, however, this motion, which is generated in the individual parts of the Earth, arises from the difference between the forces acting upon the center of the Earth and those acting upon the parts themselves, the proper force by which each particle is agitated will become known if the accelerating force which the center of the Earth experiences is subtracted from the accelerating force acting upon that particle: and this subtraction is performed in such a way that, in addition to the force actually acting upon each particle, another force equal to that which the center experiences, applied in the opposite direction, is conceived; for then the force which arises from the composition of these two will be the true force deflecting that particle from its place."}, "reconstruction": {"html": "<p>Not a step of the argument but what the argument is about. In the model it is the definition of the two quantities observed: the force on the particle less the force on the centre, taken along MC and along MR.<\/p>", "typst": "Not a step of the argument but what the argument is about. In the model it is the definition of the two quantities observed: the force on the particle less the force on the centre, taken along MC and along MR."}}, {"id": "setting", "section": "§24", "heading": "The figure: the particle M by CP = x and PM = y", "pidx": [15, 16], "pages": ["34", "35"], "loci": ["fr:enestroem/E57/0015/p03", "fr:enestroem/E57/0016/p02"], "viewer": "enestroem/E57?p=16", "steps": ["setting"], "see": [], "model": [], "corrections": [{"reason": "the stored translation was made page by page and breaks the sentence that runs over the page; Latin: quam in distantia a centro suo S semidiametro Terrae aequali exerit"}], "notes": [{"html": "<p>Euler's letters: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>C<\/mi><annotation encoding=\"application/x-tex\">C<\/annotation><\/semantics><\/math> the centre of the earth, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>S<\/mi><annotation encoding=\"application/x-tex\">S<\/annotation><\/semantics><\/math> the sun or the moon, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>M<\/mi><annotation encoding=\"application/x-tex\">M<\/annotation><\/semantics><\/math> a particle, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>P<\/mi><annotation encoding=\"application/x-tex\">P<\/annotation><\/semantics><\/math> the foot of the perpendicular from <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>M<\/mi><annotation encoding=\"application/x-tex\">M<\/annotation><\/semantics><\/math> on <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>C<\/mi><mi>S<\/mi><\/mrow><annotation encoding=\"application/x-tex\">CS<\/annotation><\/semantics><\/math>. The letter <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>S<\/mi><annotation encoding=\"application/x-tex\">S<\/annotation><\/semantics><\/math> names both the luminary and its absolute force; the formal text of the reconstruction writes the force as <code>Sf<\/code>.<\/p>", "typst": "Euler\\'s letters: $C$ the centre of the earth, $S$ the sun or the moon, $M$ a particle, $P$ the foot of the perpendicular from $M$ on $C S$. The letter $S$ names both the luminary and its absolute force; the formal text of the reconstruction writes the force as `Sf`."}, {"html": "<p>Euler's Fig. 3 also carries the points <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>N<\/mi><annotation encoding=\"application/x-tex\">N<\/annotation><\/semantics><\/math>, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>Q<\/mi><annotation encoding=\"application/x-tex\">Q<\/annotation><\/semantics><\/math>, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>O<\/mi><annotation encoding=\"application/x-tex\">O<\/annotation><\/semantics><\/math>, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>V<\/mi><annotation encoding=\"application/x-tex\">V<\/annotation><\/semantics><\/math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>R<\/mi><annotation encoding=\"application/x-tex\">R<\/annotation><\/semantics><\/math>, which §§24–26 use for the resolution of the force. The figure of the reconstruction draws <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>C<\/mi><annotation encoding=\"application/x-tex\">C<\/annotation><\/semantics><\/math>, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>S<\/mi><annotation encoding=\"application/x-tex\">S<\/annotation><\/semantics><\/math>, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>A<\/mi><annotation encoding=\"application/x-tex\">A<\/annotation><\/semantics><\/math>, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>B<\/mi><annotation encoding=\"application/x-tex\">B<\/annotation><\/semantics><\/math>, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>D<\/mi><annotation encoding=\"application/x-tex\">D<\/annotation><\/semantics><\/math>, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>E<\/mi><annotation encoding=\"application/x-tex\">E<\/annotation><\/semantics><\/math>, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>M<\/mi><annotation encoding=\"application/x-tex\">M<\/annotation><\/semantics><\/math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>P<\/mi><annotation encoding=\"application/x-tex\">P<\/annotation><\/semantics><\/math> only.<\/p>", "typst": "Euler\\'s Fig. 3 also carries the points $N$, $Q$, $O$, $V$ and $R$, which §§24--26 use for the resolution of the force. The figure of the reconstruction draws $C$, $S$, $A$, $B$, $D$, $E$, $M$ and $P$ only."}, {"html": "<p>The model takes the distance <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>C<\/mi><mi>M<\/mi><mo>=<\/mo><mi>ρ<\/mi><\/mrow><annotation encoding=\"application/x-tex\">CM = \\rho<\/annotation><\/semantics><\/math> as a parameter and the angle <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mi>C<\/mi><mi>M<\/mi><mo>=<\/mo><mi>φ<\/mi><\/mrow><annotation encoding=\"application/x-tex\">ACM = \\varphi<\/annotation><\/semantics><\/math> as what varies, so that <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>=<\/mo><mi>ρ<\/mi><mrow><mi mathvariant=\"normal\">cos<\/mi><mo>&#8289;<\/mo><\/mrow><mi>φ<\/mi><\/mrow><annotation encoding=\"application/x-tex\">x = \\rho\\cos\\varphi<\/annotation><\/semantics><\/math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y<\/mi><mo>=<\/mo><mi>ρ<\/mi><mrow><mi mathvariant=\"normal\">sin<\/mi><mo>&#8289;<\/mo><\/mrow><mi>φ<\/mi><\/mrow><annotation encoding=\"application/x-tex\">y = \\rho\\sin\\varphi<\/annotation><\/semantics><\/math>. Euler keeps <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>x<\/mi><annotation encoding=\"application/x-tex\">x<\/annotation><\/semantics><\/math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>y<\/mi><annotation encoding=\"application/x-tex\">y<\/annotation><\/semantics><\/math> and sets <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msqrt><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msqrt><mo>=<\/mo><mn>1<\/mn><\/mrow><annotation encoding=\"application/x-tex\">\\sqrt{x^2+y^2} = 1<\/annotation><\/semantics><\/math> only in §29.<\/p>", "typst": "The model takes the distance $C M = rho$ as a parameter and the angle $A C M = phi$ as what varies, so that $x = rho cos phi$ and $y = rho sin phi$. Euler keeps $x$ and $y$ and sets $sqrt(x^2 + y^2) = 1$ only in §29."}], "la": {"html": "<p><strong>24.<\/strong> Concipiatur nunc Terra tota tanquam globus <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mi>D<\/mi><mi>B<\/mi><mi>E<\/mi><\/mrow><annotation encoding=\"application/x-tex\">ADBE<\/annotation><\/semantics><\/math> [fig. 3] urgeri ad Solem Lunamve in <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>S<\/mi><annotation encoding=\"application/x-tex\">S<\/annotation><\/semantics><\/math> existentem cuius vis absoluta seu ea, quam in distantia a <span class=\"ax-pb\" title=\"here page 35 begins\">|35|<\/span> centro suo <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>S<\/mi><annotation encoding=\"application/x-tex\">S<\/annotation><\/semantics><\/math> semidiametro Terrae aequali exerit, sit <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mi>S<\/mi><\/mrow><annotation encoding=\"application/x-tex\">= S<\/annotation><\/semantics><\/math>, distantia vero centri Terrae <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>C<\/mi><annotation encoding=\"application/x-tex\">C<\/annotation><\/semantics><\/math> ab <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>S<\/mi><annotation encoding=\"application/x-tex\">S<\/annotation><\/semantics><\/math> seu <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>C<\/mi><mi>S<\/mi><\/mrow><annotation encoding=\"application/x-tex\">CS<\/annotation><\/semantics><\/math> ponatur <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mi>a<\/mi><\/mrow><annotation encoding=\"application/x-tex\">= a<\/annotation><\/semantics><\/math>; eritque vis acceleratrix, qua tota Terra tanquam in <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>C<\/mi><annotation encoding=\"application/x-tex\">C<\/annotation><\/semantics><\/math> collecta sollicitabitur in directione <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>C<\/mi><mi>S<\/mi><mo>,<\/mo><mo>=<\/mo><mfrac><mi>S<\/mi><mrow><mi>a<\/mi><mi>a<\/mi><\/mrow><\/mfrac><\/mrow><annotation encoding=\"application/x-tex\">CS, = \\frac{S}{aa}<\/annotation><\/semantics><\/math>. Contemplemur iam particulam Terrae quamcunque <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>M<\/mi><annotation encoding=\"application/x-tex\">M<\/annotation><\/semantics><\/math> cuius situs ita sit definitus, ut sit <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>C<\/mi><mi>P<\/mi><mo>=<\/mo><mi>x<\/mi><\/mrow><annotation encoding=\"application/x-tex\">CP = x<\/annotation><\/semantics><\/math> et <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mi>M<\/mi><mo>=<\/mo><mi>y<\/mi><\/mrow><annotation encoding=\"application/x-tex\">PM = y<\/annotation><\/semantics><\/math>, existente <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M<\/mi><mi>P<\/mi><\/mrow><annotation encoding=\"application/x-tex\">MP<\/annotation><\/semantics><\/math> normali ad <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>C<\/mi><mi>S<\/mi><\/mrow><annotation encoding=\"application/x-tex\">CS<\/annotation><\/semantics><\/math>; hinc igitur habebitur <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>S<\/mi><mi>P<\/mi><mo>=<\/mo><mi>a<\/mi><mo>−<\/mo><mi>x<\/mi><\/mrow><annotation encoding=\"application/x-tex\">SP = a - x<\/annotation><\/semantics><\/math> et <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>S<\/mi><mi>M<\/mi><mo>=<\/mo><msqrt><mrow><mo stretchy=\"false\" form=\"prefix\">(<\/mo><mo stretchy=\"false\" form=\"prefix\">(<\/mo><mi>a<\/mi><mo>−<\/mo><mi>x<\/mi><msup><mo stretchy=\"false\" form=\"postfix\">)<\/mo><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\" form=\"postfix\">)<\/mo><\/mrow><\/msqrt><\/mrow><annotation encoding=\"application/x-tex\">SM = \\sqrt{((a - x)^2 + y^2)}<\/annotation><\/semantics><\/math>.<\/p>", "typst": "#strong[\\24.] Concipiatur nunc Terra tota tanquam globus $A D B E$ \\[fig. 3\\] urgeri ad Solem Lunamve in $S$ existentem cuius vis absoluta seu ea, quam in distantia a #emph[|35|] centro suo $S$ semidiametro Terrae aequali exerit, sit $= S$, distantia vero centri Terrae $C$ ab $S$ seu $C S$ ponatur $= a$\\; eritque vis acceleratrix, qua tota Terra tanquam in $C$ collecta sollicitabitur in directione $C S\\,= frac(S, a a)$. Contemplemur iam particulam Terrae quamcunque $M$ cuius situs ita sit definitus, ut sit $C P = x$ et $P M = y$, existente $M P$ normali ad $C S$\\; hinc igitur habebitur $S P = a - x$ et $S M = sqrt(\\(\\(a - x\\)^2+ y^2\\))$."}, "en": {"html": "<p><strong>24.<\/strong> Let the whole Earth now be conceived as a globe <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mi>D<\/mi><mi>B<\/mi><mi>E<\/mi><\/mrow><annotation encoding=\"application/x-tex\">ADBE<\/annotation><\/semantics><\/math> [fig. 3] urged toward the Sun or Moon existing at <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>S<\/mi><annotation encoding=\"application/x-tex\">S<\/annotation><\/semantics><\/math>, whose absolute force, <span class=\"ax-corr\" title=\"corrected against the Latin: the stored translation was made page by page and breaks the sentence that runs over the page; Latin: quam in distantia a centro suo S semidiametro Terrae aequali exerit\">or that which it exerts at a distance from <span class=\"ax-pb\" title=\"here page 35 begins\">|35|<\/span> its centre <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>S<\/mi><annotation encoding=\"application/x-tex\">S<\/annotation><\/semantics><\/math> equal to the Earth's semidiameter, be <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mi>S<\/mi><\/mrow><annotation encoding=\"application/x-tex\">= S<\/annotation><\/semantics><\/math><\/span>, and let the distance of the center of the Earth <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>C<\/mi><annotation encoding=\"application/x-tex\">C<\/annotation><\/semantics><\/math> from <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>S<\/mi><annotation encoding=\"application/x-tex\">S<\/annotation><\/semantics><\/math>, or <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>C<\/mi><mi>S<\/mi><\/mrow><annotation encoding=\"application/x-tex\">CS<\/annotation><\/semantics><\/math>, be set <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mi>a<\/mi><\/mrow><annotation encoding=\"application/x-tex\">= a<\/annotation><\/semantics><\/math>; then the accelerating force by which the whole Earth, as if concentrated at <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>C<\/mi><annotation encoding=\"application/x-tex\">C<\/annotation><\/semantics><\/math>, is urged in the direction <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>C<\/mi><mi>S<\/mi><\/mrow><annotation encoding=\"application/x-tex\">CS<\/annotation><\/semantics><\/math>, will be <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mfrac><mi>S<\/mi><mrow><mi>a<\/mi><mi>a<\/mi><\/mrow><\/mfrac><\/mrow><annotation encoding=\"application/x-tex\">= \\frac{S}{aa}<\/annotation><\/semantics><\/math>. Let us now consider any particle of the Earth <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>M<\/mi><annotation encoding=\"application/x-tex\">M<\/annotation><\/semantics><\/math> whose position is defined such that <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>C<\/mi><mi>P<\/mi><mo>=<\/mo><mi>x<\/mi><\/mrow><annotation encoding=\"application/x-tex\">CP = x<\/annotation><\/semantics><\/math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mi>M<\/mi><mo>=<\/mo><mi>y<\/mi><\/mrow><annotation encoding=\"application/x-tex\">PM = y<\/annotation><\/semantics><\/math>, with <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M<\/mi><mi>P<\/mi><\/mrow><annotation encoding=\"application/x-tex\">MP<\/annotation><\/semantics><\/math> being perpendicular to <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>C<\/mi><mi>S<\/mi><\/mrow><annotation encoding=\"application/x-tex\">CS<\/annotation><\/semantics><\/math>; hence we will have <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>S<\/mi><mi>P<\/mi><mo>=<\/mo><mi>a<\/mi><mo>−<\/mo><mi>x<\/mi><\/mrow><annotation encoding=\"application/x-tex\">SP = a - x<\/annotation><\/semantics><\/math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>S<\/mi><mi>M<\/mi><mo>=<\/mo><msqrt><mrow><mo stretchy=\"false\" form=\"prefix\">(<\/mo><mo stretchy=\"false\" form=\"prefix\">(<\/mo><mi>a<\/mi><mo>−<\/mo><mi>x<\/mi><msup><mo stretchy=\"false\" form=\"postfix\">)<\/mo><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\" form=\"postfix\">)<\/mo><\/mrow><\/msqrt><\/mrow><annotation encoding=\"application/x-tex\">SM = \\sqrt{((a - x)^2 + y^2)}<\/annotation><\/semantics><\/math>.<\/p>", "typst": "#strong[\\24.] Let the whole Earth now be conceived as a globe $A D B E$ \\[fig. 3\\] urged toward the Sun or Moon existing at $S$, whose absolute force, or that which it exerts at a distance from #emph[|35|] its centre $S$ equal to the Earth\\'s semidiameter, be $= S$, and let the distance of the center of the Earth $C$ from $S$, or $C S$, be set $= a$\\; then the accelerating force by which the whole Earth, as if concentrated at $C$, is urged in the direction $C S$, will be $= frac(S, a a)$. Let us now consider any particle of the Earth $M$ whose position is defined such that $C P = x$ and $P M = y$, with $M P$ being perpendicular to $C S$\\; hence we will have $S P = a - x$ and $S M = sqrt(\\(\\(a - x\\)^2+ y^2\\))$."}}, {"id": "two-forces", "section": "§24", "heading": "The two forces on the particle", "pidx": [16], "pages": ["35"], "loci": ["fr:enestroem/E57/0016/p02"], "viewer": "enestroem/E57?p=17", "steps": [], "see": [], "model": [{"name": "fM", "symbol": "fM", "meaning": "accelerating force on the particle towards S", "defined_by": "Sf / (dist * dist)", "group": "observables"}, {"name": "fC", "symbol": "fC", "meaning": "accelerating force on the centre towards S", "defined_by": "Sf / (a * a)", "group": "observables"}], "corrections": [], "notes": [{"html": "<p>The force on <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>M<\/mi><annotation encoding=\"application/x-tex\">M<\/annotation><\/semantics><\/math> is written as <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>S<\/mi><annotation encoding=\"application/x-tex\">S<\/annotation><\/semantics><\/math> over the square of <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>S<\/mi><mi>M<\/mi><\/mrow><annotation encoding=\"application/x-tex\">SM<\/annotation><\/semantics><\/math>. The passage gives no argument for this form.<\/p>", "typst": "The force on $M$ is written as $S$ over the square of $S M$. The passage gives no argument for this form."}, {"html": "<p>Euler applies the second force to the particle in the direction <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M<\/mi><mi>N<\/mi><\/mrow><annotation encoding=\"application/x-tex\">MN<\/annotation><\/semantics><\/math>, parallel and opposite to <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>C<\/mi><mi>S<\/mi><\/mrow><annotation encoding=\"application/x-tex\">CS<\/annotation><\/semantics><\/math>; the model subtracts the force on the centre. The two say the same.<\/p>", "typst": "Euler applies the second force to the particle in the direction $M N$, parallel and opposite to $C S$\\; the model subtracts the force on the centre. The two say the same."}], "la": {"html": "<p>Vis igitur acceleratrix, qua particula <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>M<\/mi><annotation encoding=\"application/x-tex\">M<\/annotation><\/semantics><\/math> versus <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>S<\/mi><annotation encoding=\"application/x-tex\">S<\/annotation><\/semantics><\/math> pelletur, erit <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mfrac><mi>S<\/mi><mrow><mo stretchy=\"false\" form=\"prefix\">(<\/mo><mi>a<\/mi><mo>−<\/mo><mi>x<\/mi><msup><mo stretchy=\"false\" form=\"postfix\">)<\/mo><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><\/mrow><\/mfrac><\/mrow><annotation encoding=\"application/x-tex\">= \\frac{S}{(a - x)^2 + y^2}<\/annotation><\/semantics><\/math>; a qua cum auferri debeat vis, qua tota Terra versus <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>S<\/mi><annotation encoding=\"application/x-tex\">S<\/annotation><\/semantics><\/math> nititur, concipienda est particulae <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>M<\/mi><annotation encoding=\"application/x-tex\">M<\/annotation><\/semantics><\/math> applicata vis <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mfrac><mi>S<\/mi><mrow><mi>a<\/mi><mi>a<\/mi><\/mrow><\/mfrac><\/mrow><annotation encoding=\"application/x-tex\">= \\frac{S}{aa}<\/annotation><\/semantics><\/math> in directione <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M<\/mi><mi>N<\/mi><\/mrow><annotation encoding=\"application/x-tex\">MN<\/annotation><\/semantics><\/math> ipsi <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>C<\/mi><mi>S<\/mi><\/mrow><annotation encoding=\"application/x-tex\">CS<\/annotation><\/semantics><\/math> parallela et opposita; quae duae vires particulam <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>M<\/mi><annotation encoding=\"application/x-tex\">M<\/annotation><\/semantics><\/math> aeque afficient ac si universa Terra quiesceret vel uniformiter in directum moveretur, qui casus ab illo non differt. Ex his igitur ambabus viribus conatus innotescet, quo particula <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>M<\/mi><annotation encoding=\"application/x-tex\">M<\/annotation><\/semantics><\/math> a vi ad <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>S<\/mi><annotation encoding=\"application/x-tex\">S<\/annotation><\/semantics><\/math> directa de loco suo recedere annitetur: ad ipsum autem motum definiendum insuper vis gravitatis erit respicienda: et quia haec particula non est libera, sed quaquaversus materia terrestri circumdata, investigari oportet, quantum ista materia effectum viribus sollicitantibus concedat.<\/p>", "typst": "Vis igitur acceleratrix, qua particula $M$ versus $S$ pelletur, erit $= frac(S, \\(a - x\\)^2+ y^2)$\\; a qua cum auferri debeat vis, qua tota Terra versus $S$ nititur, concipienda est particulae $M$ applicata vis $= frac(S, a a)$ in directione $M N$ ipsi $C S$ parallela et opposita; quae duae vires particulam $M$ aeque afficient ac si universa Terra quiesceret vel uniformiter in directum moveretur, qui casus ab illo non differt. Ex his igitur ambabus viribus conatus innotescet, quo particula $M$ a vi ad $S$ directa de loco suo recedere annitetur: ad ipsum autem motum definiendum insuper vis gravitatis erit respicienda: et quia haec particula non est libera, sed quaquaversus materia terrestri circumdata, investigari oportet, quantum ista materia effectum viribus sollicitantibus concedat."}, "en": {"html": "<p>Therefore, the accelerating force by which the particle <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>M<\/mi><annotation encoding=\"application/x-tex\">M<\/annotation><\/semantics><\/math> is driven toward <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>S<\/mi><annotation encoding=\"application/x-tex\">S<\/annotation><\/semantics><\/math> will be <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mfrac><mi>S<\/mi><mrow><mo stretchy=\"false\" form=\"prefix\">(<\/mo><mi>a<\/mi><mo>−<\/mo><mi>x<\/mi><msup><mo stretchy=\"false\" form=\"postfix\">)<\/mo><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><\/mrow><\/mfrac><\/mrow><annotation encoding=\"application/x-tex\">= \\frac{S}{(a - x)^2 + y^2}<\/annotation><\/semantics><\/math>; since from this must be subtracted the force by which the whole Earth tends toward <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>S<\/mi><annotation encoding=\"application/x-tex\">S<\/annotation><\/semantics><\/math>, we must conceive a force <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mfrac><mi>S<\/mi><mrow><mi>a<\/mi><mi>a<\/mi><\/mrow><\/mfrac><\/mrow><annotation encoding=\"application/x-tex\">= \\frac{S}{aa}<\/annotation><\/semantics><\/math> applied to the particle <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>M<\/mi><annotation encoding=\"application/x-tex\">M<\/annotation><\/semantics><\/math> in the direction <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M<\/mi><mi>N<\/mi><\/mrow><annotation encoding=\"application/x-tex\">MN<\/annotation><\/semantics><\/math> parallel and opposite to <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>C<\/mi><mi>S<\/mi><\/mrow><annotation encoding=\"application/x-tex\">CS<\/annotation><\/semantics><\/math>; these two forces will affect the particle <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>M<\/mi><annotation encoding=\"application/x-tex\">M<\/annotation><\/semantics><\/math> in the same way as if the entire Earth were at rest or moving uniformly in a straight line, which case does not differ from that one. From these two forces, therefore, the endeavor will become known by which the particle <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>M<\/mi><annotation encoding=\"application/x-tex\">M<\/annotation><\/semantics><\/math> strives to depart from its place due to the force directed toward <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>S<\/mi><annotation encoding=\"application/x-tex\">S<\/annotation><\/semantics><\/math>; moreover, to define the motion itself, the force of gravity must also be taken into account; and since this particle is not free, but surrounded on all sides by terrestrial matter, we must investigate how much effect this matter allows to the soliciting forces.<\/p>", "typst": "Therefore, the accelerating force by which the particle $M$ is driven toward $S$ will be $= frac(S, \\(a - x\\)^2+ y^2)$\\; since from this must be subtracted the force by which the whole Earth tends toward $S$, we must conceive a force $= frac(S, a a)$ applied to the particle $M$ in the direction $M N$ parallel and opposite to $C S$\\; these two forces will affect the particle $M$ in the same way as if the entire Earth were at rest or moving uniformly in a straight line, which case does not differ from that one. From these two forces, therefore, the endeavor will become known by which the particle $M$ strives to depart from its place due to the force directed toward $S$\\; moreover, to define the motion itself, the force of gravity must also be taken into account; and since this particle is not free, but surrounded on all sides by terrestrial matter, we must investigate how much effect this matter allows to the soliciting forces."}, "reconstruction": {"html": "<p>The two forces enter the model as defined quantities: the force on the particle towards S, and the force on the centre towards S, which the principle takes away.<\/p>", "typst": "The two forces enter the model as defined quantities: the force on the particle towards S, and the force on the centre towards S, which the principle takes away."}}, {"id": "first-resolution", "section": "§25", "heading": "A first resolution, along CS and along MP", "pidx": [16, 17], "pages": ["35", "36"], "loci": ["fr:enestroem/E57/0016/p03", "fr:enestroem/E57/0017/p02"], "viewer": "enestroem/E57?p=17", "steps": [], "see": [], "model": [], "corrections": [{"reason": "one sentence over the page break; Latin: erit autem anguli OMP tangens ="}], "notes": [{"html": "<p>The tangent is the quotient of the two components just found: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mrow><mi>S<\/mi><mo stretchy=\"false\" form=\"prefix\">(<\/mo><mi>a<\/mi><mo>−<\/mo><mi>x<\/mi><mo stretchy=\"false\" form=\"postfix\">)<\/mo><\/mrow><msup><mi>d<\/mi><mn>3<\/mn><\/msup><\/mfrac><mo>−<\/mo><mfrac><mi>S<\/mi><msup><mi>a<\/mi><mn>2<\/mn><\/msup><\/mfrac><\/mrow><annotation encoding=\"application/x-tex\">\\frac{S(a-x)}{d^3} - \\frac{S}{a^2}<\/annotation><\/semantics><\/math> along <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M<\/mi><mi>Q<\/mi><\/mrow><annotation encoding=\"application/x-tex\">MQ<\/annotation><\/semantics><\/math> over <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mrow><mi>S<\/mi><mi>y<\/mi><\/mrow><msup><mi>d<\/mi><mn>3<\/mn><\/msup><\/mfrac><annotation encoding=\"application/x-tex\">\\frac{Sy}{d^3}<\/annotation><\/semantics><\/math> along <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M<\/mi><mi>P<\/mi><\/mrow><annotation encoding=\"application/x-tex\">MP<\/annotation><\/semantics><\/math>, with <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d<\/mi><mo>=<\/mo><mi>S<\/mi><mi>M<\/mi><\/mrow><annotation encoding=\"application/x-tex\">d = SM<\/annotation><\/semantics><\/math>.<\/p>", "typst": "The tangent is the quotient of the two components just found: $frac(S\\(a - x\\), d^3) - S / a^2$ along $M Q$ over $frac(S y, d^3)$ along $M P$, with $d = S M$."}], "la": {"html": "<p><strong>25.<\/strong> Quoniam autem in hoc capite nobis nondum est propositum in ipsum effectum ab his viribus oriundum inquirere, sed tantum conatum evolvere atque explorare; diligentius perpendemus, cuiusmodi vires ex combinatione harum potentiarum particulam <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>M<\/mi><annotation encoding=\"application/x-tex\">M<\/annotation><\/semantics><\/math> sollicitantium resultent. Hunc in finem resolvatur vis <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M<\/mi><mi>S<\/mi><\/mrow><annotation encoding=\"application/x-tex\">MS<\/annotation><\/semantics><\/math> in duas laterales, quarum alterius directio parallela sit ipsi <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>C<\/mi><mi>S<\/mi><\/mrow><annotation encoding=\"application/x-tex\">CS<\/annotation><\/semantics><\/math>, altera vero in <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M<\/mi><mi>P<\/mi><\/mrow><annotation encoding=\"application/x-tex\">MP<\/annotation><\/semantics><\/math> cadat: ex quo reperietur vis illa particulam <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>M<\/mi><annotation encoding=\"application/x-tex\">M<\/annotation><\/semantics><\/math> in directione <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M<\/mi><mi>Q<\/mi><\/mrow><annotation encoding=\"application/x-tex\">MQ<\/annotation><\/semantics><\/math> urgens <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mfrac><mrow><mi>S<\/mi><mo stretchy=\"false\" form=\"prefix\">(<\/mo><mi>a<\/mi><mo>−<\/mo><mi>x<\/mi><mo stretchy=\"false\" form=\"postfix\">)<\/mo><\/mrow><mrow><mo stretchy=\"false\" form=\"prefix\">(<\/mo><mo stretchy=\"false\" form=\"prefix\">(<\/mo><mi>a<\/mi><mo>−<\/mo><mi>x<\/mi><msup><mo stretchy=\"fa g/1998/Math/MathML\"><semantics><mi>S<\/mi><annotation encoding=\"application/x-tex\">S<\/annotation><\/semantics><\/math> existente reducentur ad duas, quarum altera in directione <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M<\/mi><mi>Q<\/mi><\/mrow><annotation encoding=\"application/x-tex\">MQ<\/annotation><\/semantics><\/math> urgens erit <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mfrac><mrow><mi>S<\/mi><mo stretchy=\"false\" form=\"prefix\">(<\/mo><mi>a<\/mi><mo>−<\/mo><mi>x<\/mi><mo stretchy=\"false\" form=\"postfix\">)<\/mo><\/mrow><mrow><mo stretchy=\"false\" form=\"prefix\">(<\/mo><mo stretchy=\"false\" form=\"prefix\">(<\/mo><mi>a<\/mi><mo>−<\/mo><mi>x<\/mi><msup><mo stretchy=\"false\" form=\"postfix\">)<\/mo><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><msup><mo stretchy=\"false\" form=\"postfix\">)<\/mo><mrow><mn>3<\/mn><mi>/<\/mi><mn>2<\/mn><\/mrow><\/msup><\/mrow><\/mfrac><mo>−<\/mo><mfrac><mi>S<\/mi><msup><mi>a<\/mi><mn>2<\/mn><\/msup><\/mfrac><\/mrow><annotation encoding=\"application/x-tex\">= \\frac{S(a - x)}{((a - x)^2 + y^2)^{3/2}} - \\frac{S}{a^2}<\/annotation><\/semantics><\/math>, altera vero directionem habens <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M<\/mi><mi>P<\/mi><mo>=<\/mo><mfrac><mrow><mi>S<\/mi><mi>y<\/mi><\/mrow><mrow><mo stretchy=\"false\" form=\"prefix\">(<\/mo><mo stretchy=\"false\" form=\"prefix\">(<\/mo><mi>a<\/mi><mo>−<\/mo><mi>x<\/mi><msup><mo stretchy=\"false\" form=\"postfix\">)<\/mo><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><msup><mo stretchy=\"false\" form=\"postfix\">)<\/mo><mrow><mn>3<\/mn><mi>/<\/mi><mn>2<\/mn><\/mrow><\/msup><\/mrow><\/mfrac><\/mrow><annotation encoding=\"application/x-tex\">MP = \\frac{Sy}{((a - x)^2 + y^2)^{3/2}}<\/annotation><\/semantics><\/math>. Quare si rectae <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M<\/mi><mi>Q<\/mi><\/mrow><annotation encoding=\"application/x-tex\">MQ<\/annotation><\/semantics><\/math> et <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M<\/mi><mi>P<\/mi><\/mrow><annotation encoding=\"application/x-tex\">MP<\/annotation><\/semantics><\/math> his viribus proportionales capiantur, et rectangulum <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M<\/mi><mi>Q<\/mi><mi>O<\/mi><mi>P<\/mi><\/mrow><annotation encoding=\"application/x-tex\">MQOP<\/annotation><\/semantics><\/math> compleatur exprimet diagonalis <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M<\/mi><mi>O<\/mi><\/mrow><annotation encoding=\"application/x-tex\">MO<\/annotation><\/semantics><\/math> tam directionem quam quantitatem vis ex tribus praecedentibus ortae: erit <span class=\"ax-pb\" title=\"here page 36 begins\">|36|<\/span> autem anguli <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>O<\/mi><mi>M<\/mi><mi>P<\/mi><\/mrow><annotation encoding=\"application/x-tex\">OMP<\/annotation><\/semantics><\/math> tangens <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mfrac><mrow><mi>a<\/mi><mo>−<\/mo><mi>x<\/mi><\/mrow><mi>y<\/mi><\/mfrac><mo>−<\/mo><mfrac><mrow><mo stretchy=\"false\" form=\"prefix\">(<\/mo><mo stretchy=\"false\" form=\"prefix\">(<\/mo><mi>a<\/mi><mo>−<\/mo><mi>x<\/mi><msup><mo stretchy=\"false\" form=\"postfix\">)<\/mo><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><msup><mo stretchy=\"false\" form=\"postfix\">)<\/mo><mrow><mn>3<\/mn><mi>/<\/mi><mn>2<\/mn><\/mrow><\/msup><\/mrow><mrow><msup><mi>a<\/mi><mn>2<\/mn><\/msup><mi>y<\/mi><\/mrow><\/mfrac><\/mrow><annotation encoding=\"application/x-tex\">= \\frac{a - x}{y} - \\frac{((a - x)^2 + y^2)^{3/2}}{a^2 y}<\/annotation><\/semantics><\/math>; quo cognito, si fiat ut <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M<\/mi><mi>P<\/mi><\/mrow><annotation encoding=\"application/x-tex\">MP<\/annotation><\/semantics><\/math> ad <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M<\/mi><mi>O<\/mi><\/mrow><annotation encoding=\"application/x-tex\">MO<\/annotation><\/semantics><\/math> ita <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mrow><mi>S<\/mi><mi>y<\/mi><\/mrow><mrow><mo stretchy=\"false\" form=\"prefix\">(<\/mo><mo stretchy=\"false\" form=\"prefix\">(<\/mo><mi>a<\/mi><mo>−<\/mo><mi>x<\/mi><msup><mo stretchy=\"false\" form=\"postfix\">)<\/mo><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><msup><mo stretchy=\"false\" form=\"postfix\">)<\/mo><mrow><mn>3<\/mn><mi>/<\/mi><mn>2<\/mn><\/mrow><\/msup><\/mrow><\/mfrac><annotation encoding=\"application/x-tex\">\\frac{Sy}{((a - x)^2 + y^2)^{3/2}}<\/annotation><\/semantics><\/math> ad quartam, haec ipsa quarta proportionalis erit vis particulam <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>M<\/mi><annotation encoding=\"application/x-tex\">M<\/annotation><\/semantics><\/math> in directione <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M<\/mi><mi>O<\/mi><\/mrow><annotation encoding=\"application/x-tex\">MO<\/annotation><\/semantics><\/math> sollicitans, quae oritur a vi ad <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>S<\/mi><annotation encoding=\"application/x-tex\">S<\/annotation><\/semantics><\/math> tendente.<\/p>", "typst": "#strong[\\25.] Quoniam autem in hoc capite nobis nondum est propositum in ipsum effectum ab his viribus oriundum inquirere, sed tantum conatum evolvere atque explorare; diligentius perpendemus, cuiusmodi vires ex combinatione harum potentiarum particulam $M$ sollicitantium resultent. Hunc in finem resolvatur vis $M S$ in duas laterales, quarum alterius directio parallela sit ipsi $C S$, altera vero in $M P$ cadat: ex quo reperietur vis illa particulam $M$ in directione $M Q$ urgens $= frac(S\\(a - x\\), \\(\\(a - x\\)^2+ y^2\\)^(3\\/2))$\\; altera vero vis in directione $M P$ trahens $= frac(S y, \\(\\(a - x\\)^2+ y^2\\)^(3\\/2))$. Cum autem particula $M$ insuper trahatur in directione $M N$ vi $= frac(S, a a)$, tres istae vires a Sole Lunave in $S$ existente reducentur ad duas, quarum altera in directione $M Q$ urgens erit $= frac(S\\(a - x\\), \\(\\(a - x\\)^2+ y^2\\)^(3\\/2)) - S / a^2$, altera vero directionem habens $M P = frac(S y, \\(\\(a - x\\)^2+ y^2\\)^(3\\/2))$. Quare si rectae $M Q$ et $M P$ his viribus proportionales capiantur, et rectangulum $M Q O P$ compleatur exprimet diagonalis $M O$ tam directionem quam quantitatem vis ex tribus praecedentibus ortae: erit #emph[|36|] autem anguli $O M P$ tangens $= frac(a - x, y) - frac(\\(\\(a - x\\)^2+ y^2\\)^(3\\/2), a^2 y)$\\; quo cognito, si fiat ut $M P$ ad $M O$ ita $frac(S y, \\(\\(a - x\\)^2+ y^2\\)^(3\\/2))$ ad quartam, haec ipsa quarta proportionalis erit vis particulam $M$ in directione $M O$ sollicitans, quae oritur a vi ad $S$ tendente."}, "en": {"html": "<p><strong>25.<\/strong> Since, however, in this chapter it is not yet our purpose to inquire into the actual effect arising from these forces, but only to develop and explore the endeavor, we shall examine more carefully what kind of forces result from the combination of these powers soliciting the particle <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>M<\/mi><annotation encoding=\"application/x-tex\">M<\/annotation><\/semantics><\/math>. To this end, let the force <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M<\/mi><mi>S<\/mi><\/mrow><annotation encoding=\"application/x-tex\">MS<\/annotation><\/semantics><\/math> be resolved into two lateral forces, the direction of one of which is parallel to <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>C<\/mi><mi>S<\/mi><\/mrow><annotation encoding=\"application/x-tex\">CS<\/annotation><\/semantics><\/math>, while the other falls along <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M<\/mi><mi>P<\/mi><\/mrow><annotation encoding=\"application/x-tex\">MP<\/annotation><\/semantics><\/math>; from this, that force urging the particle <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>M<\/mi><annotation encoding=\"application/x-tex\">M<\/annotation><\/semantics><\/math> in the direction <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M<\/mi><mi>Q<\/mi><\/mrow><annotation encoding=\"application/x-tex\">MQ<\/annotation><\/semantics><\/math> will be found to be <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mfrac><mrow><mi>S<\/mi><mo stretchy=\"false\" form=\"prefix\">(<\/mo><mi>a<\/mi><mo>−<\/mo><mi>x<\/mi><mo stretchy=\"false\" form=\"postfix\">)<\/mo><\/mrow><mrow><mo stretchy=\"false\" form=\"prefix\">(<\/mo><mo stretchy=\"false\" form=\"prefix\">(<\/mo><mi>a<\/mi><mo>−<\/mo><mi>x<\/mi><msup><mo stretchy=\"false\" form=\"postfix\">)<\/mo><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><msup><mo stretchy=\"false\" form=\"postfix\">)<\/mo><mrow><mn>3<\/mn><mi>/<\/mi><mn>2<\/mn><\/mrow><\/msup><\/mrow><\/mfrac><\/mrow><annotation encoding=\"application/x-tex\">= \\frac{S(a - x)}{((a - x)^2 + y^2)^{3/2}}<\/annotation><\/semantics><\/math>, and the other force pulling in the direction <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M<\/mi><mi>P<\/mi><\/mrow><annotation encoding=\"application/x-tex\">MP<\/annotation><\/semantics><\/math> will be <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mfrac><mrow><mi>S<\/mi><mi>y<\/mi><\/mrow><mrow><mo stretchy=\"false\" form=\"prefix\">(<\/mo><mo stretchy=\"false\" form=\"prefix\">(<\/mo><mi>a<\/mi><mo>−<\/mo><mi>x<\/mi><msup><mo stretchy=\"false\" form=\"postfix\">)<\/mo><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><msup><mo stretchy=\"false\" form=\"postfix\">)<\/mo><mrow><mn>3<\/mn><mi>/<\/mi><mn>2<\/mn><\/mrow><\/msup><\/mrow><\/mfrac><\/mrow><annotation encoding=\"application/x-tex\">= \\frac{Sy}{((a - x)^2 + y^2)^{3/2}}<\/annotation><\/semantics><\/math>. But since the particle <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>M<\/mi><annotation encoding=\"application/x-tex\">M<\/annotation><\/semantics><\/math> is additionally pulled in the direction <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M<\/mi><mi>N<\/mi><\/mrow><annotation encoding=\"application/x-tex\">MN<\/annotation><\/semantics><\/math> by a force <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mfrac><mi>S<\/mi><mrow><mi>a<\/mi><mi>a<\/mi><\/mrow><\/mfrac><\/mrow><annotation encoding=\"application/x-tex\">= \\frac{S}{aa}<\/annotation><\/semantics><\/math>, these three forces from the Sun or Moon existing at <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>S<\/mi><annotation encoding=\"application/x-tex\">S<\/annotation><\/semantics><\/math> will be reduced to two, of which one urging in the direction <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M<\/mi><mi>Q<\/mi><\/mrow><annotation encoding=\"application/x-tex\">MQ<\/annotation><\/semantics><\/math> will be <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mfrac><mrow><mi>S<\/mi><mo stretchy=\"false\" form=\"prefix\">(<\/mo><mi>a<\/mi><mo>−<\/mo><mi>x<\/mi><mo stretch =\"false\" form=\"prefix\">(<\/mo><mo stretchy=\"false\" form=\"prefix\">(<\/mo><mi>a<\/mi><mo>−<\/mo><mi>x<\/mi><msup><mo stretchy=\"false\" form=\"postfix\">)<\/mo><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><msup><mo stretchy=\"false\" form=\"postfix\">)<\/mo><mrow><mn>3<\/mn><mi>/<\/mi><mn>2<\/mn><\/mrow><\/msup><\/mrow><\/mfrac><mo>=<\/mo><mo stretchy=\"false\" form=\"prefix\">(<\/mo><msup><mi>a<\/mi><mn>2<\/mn><\/msup><mo>−<\/mo><mn>2<\/mn><mi>a<\/mi><mi>x<\/mi><mo>+<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><msup><mo stretchy=\"false\" form=\"postfix\">)<\/mo><mrow><mi>−<\/mi><mn>3<\/mn><mi>/<\/mi><mn>2<\/mn><\/mrow><\/msup><\/mrow><annotation encoding=\"application/x-tex\">\\frac{1}{((a-x)^2+y^2)^{3/2}} = (a^2 - 2ax + x^2 + y^2)^{-3/2}<\/annotation><\/semantics><\/math> <math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mfrac><mn>1<\/mn><msup><mi>a<\/mi><mn>3<\/mn><\/msup><\/mfrac><mo>+<\/mo><mfrac><mrow><mn>3<\/mn><mo stretchy=\"false\" form=\"prefix\">(<\/mo><mn>2<\/mn><mi>a<\/mi><mi>x<\/mi><mo>−<\/mo><mi>x<\/mi><mi>x<\/mi><mo>−<\/mo><mi>y<\/mi><mi>y<\/mi><mo stretchy=\"false\" form=\"postfix\">)<\/mo><\/mrow><mrow><mn>2<\/mn><msup><mi>a<\/mi><mn>5<\/mn><\/msup><\/mrow><\/mfrac><mo>+<\/mo><mfrac><mrow><mn>15<\/mn><mo stretchy=\"false\" form=\"prefix\">(<\/mo><mn>2<\/mn><mi>a<\/mi><mi>x<\/mi><mo>−<\/mo><mi>x<\/mi><mi>x<\/mi><mo>−<\/mo><mi>y<\/mi><mi>y<\/mi><msup><mo stretchy=\"false\" form=\"postfix\">)<\/mo><mn>2<\/mn><\/msup><\/mrow><mrow><mn>8<\/mn><msup><mi>a<\/mi><mn>7<\/mn><\/msup><\/mrow><\/mfrac><mo>,<\/mo><\/mrow><annotation encoding=\"application/x-tex\">= \\frac{1}{a^3} + \\frac{3(2ax - xx - yy)}{2a^5} + \\frac{15(2ax - xx - yy)^2}{8a^7},<\/annotation><\/semantics><\/math><\/p>\n<p>loco <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mn>1<\/mn><mrow><mo stretchy=\"false\" form=\"prefix\">(<\/mo><mo stretchy=\"false\" form=\"prefix\">(<\/mo><mi>a<\/mi><mo>−<\/mo><mi>x<\/mi><msup><mo stretchy=\"false\" form=\"postfix\">)<\/mo><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><msup><mo stretchy=\"false\" form=\"postfix\">)<\/mo><mrow><mn>3<\/mn><mi>/<\/mi><mn>2<\/mn><\/mrow><\/msup><\/mrow><\/mfrac><annotation encoding=\"application/x-tex\">\\frac{1}{((a-x)^2+y^2)^{3/2}}<\/annotation><\/semantics><\/math> satis tuto substitui poterit <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mn>1<\/mn><msup><mi>a<\/mi><mn>3<\/mn><\/msup><\/mfrac><mo>+<\/mo><mfrac><mrow><mn>3<\/mn><mi>x<\/mi><\/mrow><msup><mi>a<\/mi><mn>4<\/mn><\/msup><\/mfrac><mo>+<\/mo><mfrac><mrow><mn>3<\/mn><mo stretchy=\"false\" form=\"prefix\">(<\/mo><mn>4<\/mn><mi>x<\/mi><mi>x<\/mi><mo>−<\/mo><mi>y<\/mi><mi>y<\/mi><mo stretchy=\"false\" form=\"postfix\">)<\/mo><\/mrow><mrow><mn>2<\/mn><msup><mi>a<\/mi><mn>5<\/mn><\/msup><\/mrow><\/mfrac><\/mrow><annotation encoding=\"application/x-tex\">\\frac{1}{a^3} + \\frac{3x}{a^4} + \\frac{3(4xx - yy)}{2a^5}<\/annotation><\/semantics><\/math>. Ex his autem obtinebitur vis, qua particula <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>M<\/mi><annotation encoding=\"application/x-tex\">M<\/annotation><\/semantics><\/math> praeter gravitatem a vi Solis sive Lunae in <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>S<\/mi><annotation encoding=\"application/x-tex\">S<\/annotation><\/semantics><\/math> existentis ad centrum Terrae <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>C<\/mi><annotation encoding=\"application/x-tex\">C<\/annotation><\/semantics><\/math> in directione <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M<\/mi><mi>C<\/mi><\/mrow><annotation encoding=\"application/x-tex\">MC<\/annotation><\/semantics><\/math> urgetur,<\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mfrac><mrow><mi>S<\/mi><mo stretchy=\"false\" form=\"prefix\">(<\/mo><mi>y<\/mi><mi>y<\/mi><mo>−<\/mo><mn>2<\/mn><mi>x<\/mi><mi>x<\/mi><mo stretchy=\"false\" form=\"postfix\">)<\/mo><\/mrow><mrow><msup><mi>a<\/mi><mn>3<\/mn><\/msup><msqrt><mrow><mo stretchy=\"false\" form=\"prefix\">(<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\" form=\"postfix\">)<\/mo><\/mrow><\/msqrt><\/mrow><\/mfrac><mo>+<\/mo><mfrac><mrow><mn>3<\/mn><mi>S<\/mi><mi>x<\/mi><mo stretchy=\"false\" form=\"prefix\">(<\/mo><mn>3<\/mn><mi>y<\/mi><mi>y<\/mi><mo>−<\/mo><mn>2<\/mn><mi>x<\/mi><mi>x<\/mi><mo stretchy=\"false\" form=\"postfix\">)<\/mo><\/mrow><mrow><mn>2<\/mn><msup><mi>a<\/mi><mn>4<\/mn><\/msup><msqrt><mrow><mo stretchy=\"false\" form=\"prefix\">(<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\" form=\"postfix\">)<\/mo><\/mrow><\/msqrt><\/mrow><\/mfrac><mi>.<\/mi><\/mrow><annotation encoding=\"application/x-tex\">= \\frac{S(yy - 2xx)}{a^3\\sqrt{(x^2+y^2)}} + \\frac{3Sx(3yy - 2xx)}{2a^4\\sqrt{(x^2+y^2)}}.<\/annotation><\/semantics><\/math><\/p>", "typst": "#strong[\\27.] Tametsi istae expressiones tantopere sint compositae, ut parum ex iis ad usum deduci posse videatur, tamen si consideremus distantiam Lunae a Terra, multo magis autem distantiam Solis, vehementer excedere quantitatem Terrae, ac propterea quantitates $x$ et $y$\\; per approximationem satis commodas formulas ex iis derivare licebit. Cum enim sit proxime\n\n$ frac(1, \\(\\(a - x\\)^2+ y^2\\)^(3\\/2)) =\\(a^2 - 2 a x + x^2 + y^2\\)^(- 3\\/2) $ $ = 1 / a^3 + frac(3\\(2 a x - x x - y y\\), 2 a^5) + frac(15\\(2 a x - x x - y y\\)^2, 8 a^7)\\, $\n\nloco $frac(1, \\(\\(a - x\\)^2+ y^2\\)^(3\\/2))$ satis tuto substitui poterit $1 / a^3 + frac(3 x, a^4) + frac(3\\(4 x x - y y\\), 2 a^5)$. Ex his autem obtinebitur vis, qua particula $M$ praeter gravitatem a vi Solis sive Lunae in $S$ existentis ad centrum Terrae $C$ in directione $M C$ urgetur,\n\n$ = frac(S\\(y y - 2 x x\\), a^3 sqrt(\\(x^2 + y^2\\))) + frac(3 S x\\(3 y y - 2 x x\\), 2 a^4 sqrt(\\(x^2 + y^2\\))) . $"}, "en": {"html": "<p><strong>27.<\/strong> Although these expressions are so complex that it seems little can be derived from them for practical use, nevertheless, if we consider that the distance of the Moon from the Earth, and much more so the distance of the Sun, greatly exceeds the size of the Earth, and therefore the quantities <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>x<\/mi><annotation encoding=\"application/x-tex\">x<\/annotation><\/semantics><\/math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>y<\/mi><annotation encoding=\"application/x-tex\">y<\/annotation><\/semantics><\/math>, it will be possible to derive sufficiently convenient formulas from them by approximation. For since, approximately,<\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mn>1<\/mn><mrow><mo stretchy=\"false\" form=\"prefix\">(<\/mo><mo stretchy=\"false\" form=\"prefix\">(<\/mo><mi>a<\/mi><mo>−<\/mo><mi>x<\/mi><msup><mo stretchy=\"false\" form=\"postfix\">)<\/mo><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><msup><mo stretchy=\"false\" form=\"postfix\">)<\/mo><mrow><mn>3<\/mn><mi>/<\/mi><mn>2<\/mn><\/mrow><\/msup><\/mrow><\/mfrac><mo>=<\/mo><mo stretchy=\"false\" form=\"prefix\">(<\/mo><msup><mi>a<\/mi><mn>2<\/mn><\/msup><mo>−<\/mo><mn>2<\/mn><mi>a<\/mi><mi>x<\/mi><mo>+<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><msup><mo stretchy=\"false\" form=\"postfix\">)<\/mo><mrow><mi>−<\/mi><mn>3<\/mn><mi>/<\/mi><mn>2<\/mn><\/mrow><\/msup><\/mrow><annotation encoding=\"application/x-tex\">\\frac{1}{((a - x)^2 + y^2)^{3/2}} = (a^2 - 2ax + x^2 + y^2)^{-3/2}<\/annotation><\/semantics><\/math> <math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mfrac><mn>1<\/mn><msup><mi>a<\/mi><mn>3<\/mn><\/msup><\/mfrac><mo>+<\/mo><mfrac><mrow><mn>3<\/mn><mo stretchy=\"false\" form=\"prefix\">(<\/mo><mn>2<\/mn><mi>a<\/mi><mi>x<\/mi><mo>−<\/mo><mi>x<\/mi><mi>x<\/mi><mo>−<\/mo><mi>y<\/mi><mi>y<\/mi><mo stretchy=\"false\" form=\"postfix\">)<\/mo><\/mrow><mrow><mn>2<\/mn><msup><mi>a<\/mi><mn>5<\/mn><\/msup><\/mrow><\/mfrac><mo>+<\/mo><mfrac><mrow><mn>15<\/mn><mo stretchy=\"false\" form=\"prefix\">(<\/mo><mn>2<\/mn><mi>a<\/mi><mi>x<\/mi><mo>−<\/mo><mi>x<\/mi><mi>x<\/mi><mo>−<\/mo><mi>y<\/mi><mi>y<\/mi><msup><mo stretchy=\"false\" form=\"postfix\">)<\/mo><mn>2<\/mn><\/msup><\/mrow><mrow><mn>8<\/mn><msup><mi>a<\/mi><mn>7<\/mn><\/msup><\/mrow><\/mfrac><mo>,<\/mo><\/mrow><annotation encoding=\"application/x-tex\">= \\frac{1}{a^3} + \\frac{3(2ax - xx - yy)}{2a^5} + \\frac{15(2ax - xx - yy)^2}{8a^7},<\/annotation><\/semantics><\/math><\/p>\n<p>in place of <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mn>1<\/mn><mrow><mo stretchy=\"false\" form=\"prefix\">(<\/mo><mo stretchy=\"false\" form=\"prefix\">(<\/mo><mi>a<\/mi><mo>−<\/mo><mi>x<\/mi><msup><mo stretchy=\"false\" form=\"postfix\">)<\/mo><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><msup><mo stretchy=\"false\" form=\"postfix\">)<\/mo><mrow><mn>3<\/mn><mi>/<\/mi><mn>2<\/mn><\/mrow><\/msup><\/mrow><\/mfrac><annotation encoding=\"application/x-tex\">\\frac{1}{((a - x)^2 + y^2)^{3/2}}<\/annotation><\/semantics><\/math> one can quite safely substitute <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mn>1<\/mn><msup><mi>a<\/mi><mn>3<\/mn><\/msup><\/mfrac><mo>+<\/mo><mfrac><mrow><mn>3<\/mn><mi>x<\/mi><\/mrow><msup><mi>a<\/mi><mn>4<\/mn><\/msup><\/mfrac><mo>+<\/mo><mfrac><mrow><mn>3<\/mn><mo stretchy=\"false\" form=\"prefix\">(<\/mo><mn>4<\/mn><mi>x<\/mi><mi>x<\/mi><mo>−<\/mo><mi>y<\/mi><mi>y<\/mi><mo stretchy=\"false\" form=\"postfix\">)<\/mo><\/mrow><mrow><mn>2<\/mn><msup><mi>a<\/mi><mn>5<\/mn><\/msup><\/mrow><\/mfrac><\/mrow><annotation encoding=\"application/x-tex\">\\frac{1}{a^3} + \\frac{3x}{a^4} + \\frac{3(4xx - yy)}{2a^5}<\/annotation><\/semantics><\/math>. From these, moreover, is obtained the force by which a particle <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>M<\/mi><annotation encoding=\"application/x-tex\">M<\/annotation><\/semantics><\/math>, in addition to gravity, is urged toward the center of the Earth <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>C<\/mi><annotation encoding=\"application/x-tex\">C<\/annotation><\/semantics><\/math> in the direction <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M<\/mi><mi>C<\/mi><\/mrow><annotation encoding=\"application/x-tex\">MC<\/annotation><\/semantics><\/math> by the force of the Sun or Moon located at <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>S<\/mi><annotation encoding=\"application/x-tex\">S<\/annotation><\/semantics><\/math>,<\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mfrac><mrow><mi>S<\/mi><mo stretchy=\"false\" form=\"prefix\">(<\/mo><mi>y<\/mi><mi>y<\/mi><mo>−<\/mo><mn>2<\/mn><mi>x<\/mi><mi>x<\/mi><mo stretchy=\"false\" form=\"postfix\">)<\/mo><\/mrow><mrow><msup><mi>a<\/mi><mn>3<\/mn><\/msup><msqrt><mrow><mo stretchy=\"false\" form=\"prefix\">(<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\" form=\"postfix\">)<\/mo><\/mrow><\/msqrt><\/mrow><\/mfrac><mo>+<\/mo><mfrac><mrow><mn>3<\/mn><mi>S<\/mi><mi>x<\/mi><mo stretchy=\"false\" form=\"prefix\">(<\/mo><mn>3<\/mn><mi>y<\/mi><mi>y<\/mi><mo>−<\/mo><mn>2<\/mn><mi>x<\/mi><mi>x<\/mi><mo stretchy=\"false\" form=\"postfix\">)<\/mo><\/mrow><mrow><mn>2<\/mn><msup><mi>a<\/mi><mn>4<\/mn><\/msup><msqrt><mrow><mo stretchy=\"false\" form=\"prefix\">(<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\" form=\"postfix\">)<\/mo><\/mrow><\/msqrt><\/mrow><\/mfrac><mi>.<\/mi><\/mrow><annotation encoding=\"application/x-tex\">= \\frac{S(yy - 2xx)}{a^3 \\sqrt{(x^2 + y^2)}} + \\frac{3Sx(3yy - 2xx)}{2a^4 \\sqrt{(x^2 + y^2)}}.<\/annotation><\/semantics><\/math><\/p>", "typst": "#strong[\\27.] Although these expressions are so complex that it seems little can be derived from them for practical use, nevertheless, if we consider that the distance of the Moon from the Earth, and much more so the distance of the Sun, greatly exceeds the size of the Earth, and therefore the quantities $x$ and $y$, it will be possible to derive sufficiently convenient formulas from them by approximation. For since, approximately,\n\n$ frac(1, \\(\\(a - x\\)^2+ y^2\\)^(3\\/2)) =\\(a^2 - 2 a x + x^2 + y^2\\)^(- 3\\/2) $ $ = 1 / a^3 + frac(3\\(2 a x - x x - y y\\), 2 a^5) + frac(15\\(2 a x - x x - y y\\)^2, 8 a^7)\\, $\n\nin place of $frac(1, \\(\\(a - x\\)^2+ y^2\\)^(3\\/2))$ one can quite safely substitute $1 / a^3 + frac(3 x, a^4) + frac(3\\(4 x x - y y\\), 2 a^5)$. From these, moreover, is obtained the force by which a particle $M$, in addition to gravity, is urged toward the center of the Earth $C$ in the direction $M C$ by the force of the Sun or Moon located at $S$,\n\n$ = frac(S\\(y y - 2 x x\\), a^3 sqrt(\\(x^2 + y^2\\))) + frac(3 S x\\(3 y y - 2 x x\\), 2 a^4 sqrt(\\(x^2 + y^2\\))) . $"}}, {"id": "emendation", "section": "§27", "heading": "The force across the vertical to two terms, and the editor's correction", "pidx": [18], "pages": ["37"], "loci": ["fr:enestroem/E57/0018/p06", "fr:enestroem/E57/0018/p07", "fr:enestroem/E57/0018/p10"], "viewer": "enestroem/E57?p=19", "steps": ["second_MR"], "see": [], "model": [], "corrections": [], "notes": [{"html": "<p><strong>The printed text and the reconstruction differ here.<\/strong> Opera omnia II 31 prints <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4<\/mn><mi>x<\/mi><mi>x<\/mi><mo>+<\/mo><mi>y<\/mi><mi>y<\/mi><\/mrow><annotation encoding=\"application/x-tex\">4xx + yy<\/annotation><\/semantics><\/math>; its note 5 says that the first edition and the manuscript have <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4<\/mn><mi>x<\/mi><mi>x<\/mi><mo>−<\/mo><mi>y<\/mi><mi>y<\/mi><\/mrow><annotation encoding=\"application/x-tex\">4xx - yy<\/annotation><\/semantics><\/math> and that the editor corrected it. The reconstruction follows the first edition and the manuscript, which are known here only through that note.<\/p>", "typst": "#strong[The printed text and the reconstruction differ here.] Opera omnia II 31 prints $4 x x + y y$\\; its note 5 says that the first edition and the manuscript have $4 x x - y y$ and that the editor corrected it. The reconstruction follows the first edition and the manuscript, which are known here only through that note."}, {"html": "<p>Reason: multiply the exact expression of §26, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mrow><mi>S<\/mi><mi>y<\/mi><\/mrow><msqrt><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msqrt><\/mfrac><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mfrac><mi>a<\/mi><msup><mi>d<\/mi><mn>3<\/mn><\/msup><\/mfrac><mo>−<\/mo><mfrac><mn>1<\/mn><msup><mi>a<\/mi><mn>2<\/mn><\/msup><\/mfrac><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">\\frac{Sy}{\\sqrt{x^2+y^2}}\\left(\\frac{a}{d^3} - \\frac{1}{a^2}\\right)<\/annotation><\/semantics><\/math>, by Euler's own substitution for <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1<\/mn><mi>/<\/mi><msup><mi>d<\/mi><mn>3<\/mn><\/msup><\/mrow><annotation encoding=\"application/x-tex\">1/d^3<\/annotation><\/semantics><\/math> three lines above. The second term comes out with <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4<\/mn><mi>x<\/mi><mi>x<\/mi><mo>−<\/mo><mi>y<\/mi><mi>y<\/mi><\/mrow><annotation encoding=\"application/x-tex\">4xx - yy<\/annotation><\/semantics><\/math>.<\/p>", "typst": "Reason: multiply the exact expression of §26, $frac(S y, sqrt(x^2 + y^2)) (a / d^3 - 1 / a^2)$, by Euler\\'s own substitution for $1\\/d^3$ three lines above. The second term comes out with $4 x x - y y$."}, {"html": "<p>Test against the exact expression, the small ratio at 0.01, 0.001, 0.0001: with <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4<\/mn><mi>x<\/mi><mi>x<\/mi><mo>−<\/mo><mi>y<\/mi><mi>y<\/mi><\/mrow><annotation encoding=\"application/x-tex\">4xx - yy<\/annotation><\/semantics><\/math> the relative difference is 1.8e-4, 1.8e-6, 1.8e-8 (second order); with <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4<\/mn><mi>x<\/mi><mi>x<\/mi><mo>+<\/mo><mi>y<\/mi><mi>y<\/mi><\/mrow><annotation encoding=\"application/x-tex\">4xx + yy<\/annotation><\/semantics><\/math> it is 2.0e-2, 2.0e-3, 2.0e-4 (first order only). The emended formula is the argument <code>euler-tide-force-emendation<\/code>, which fails the check as it should.<\/p>", "typst": "Test against the exact expression, the small ratio at 0.01, 0.001, 0.0001: with $4 x x - y y$ the relative difference is 1.8e-4, 1.8e-6, 1.8e-8 (second order); with $4 x x + y y$ it is 2.0e-2, 2.0e-3, 2.0e-4 (first order only). The emended formula is the argument `euler-tide-force-emendation`, which fails the check as it should."}], "la": {"html": "<p>Praeterea autem eadem particula <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>M<\/mi><annotation encoding=\"application/x-tex\">M<\/annotation><\/semantics><\/math> sollicitabitur in directione <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M<\/mi><mi>R<\/mi><\/mrow><annotation encoding=\"application/x-tex\">MR<\/annotation><\/semantics><\/math> ad <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M<\/mi><mi>C<\/mi><\/mrow><annotation encoding=\"application/x-tex\">MC<\/annotation><\/semantics><\/math> normali, vi<sup>5<\/sup>)<\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mfrac><mrow><mn>3<\/mn><mi>S<\/mi><mi>x<\/mi><mi>y<\/mi><\/mrow><mrow><msup><mi>a<\/mi><mn>3<\/mn><\/msup><msqrt><mrow><mo stretchy=\"false\" form=\"prefix\">(<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\" form=\"postfix\">)<\/mo><\/mrow><\/msqrt><\/mrow><\/mfrac><mo>+<\/mo><mfrac><mrow><mn>3<\/mn><mi>S<\/mi><mi>y<\/mi><mo stretchy=\"false\" form=\"prefix\">(<\/mo><mn>4<\/mn><mi>x<\/mi><mi>x<\/mi><mo>+<\/mo><mi>y<\/mi><mi>y<\/mi><mo stretchy=\"false\" form=\"postfix\">)<\/mo><\/mrow><mrow><mn>2<\/mn><msup><mi>a<\/mi><mn>4<\/mn><\/msup><msqrt><mrow><mo stretchy=\"false\" form=\"prefix\">(<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\" form=\"postfix\">)<\/mo><\/mrow><\/msqrt><\/mrow><\/mfrac><mo>=<\/mo><mfrac><mrow><mn>3<\/mn><mi>S<\/mi><mi>y<\/mi><\/mrow><mrow><msup><mi>a<\/mi><mn>3<\/mn><\/msup><msqrt><mrow><mo stretchy=\"false\" form=\"prefix\">(<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\" form=\"postfix\">)<\/mo><\/mrow><\/msqrt><\/mrow><\/mfrac><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>x<\/mi><mo>+<\/mo><mfrac><mrow><mn>4<\/mn><mi>x<\/mi><mi>x<\/mi><mo>+<\/mo><mi>y<\/mi><mi>y<\/mi><\/mrow><mrow><mn>2<\/mn><mi>a<\/mi><\/mrow><\/mfrac><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mi>.<\/mi><\/mrow><annotation encoding=\"application/x-tex\">= \\frac{3Sxy}{a^3\\sqrt{(x^2+y^2)}} + \\frac{3Sy(4xx + yy)}{2a^4\\sqrt{(x^2+y^2)}} = \\frac{3Sy}{a^3\\sqrt{(x^2+y^2)}}\\left(x + \\frac{4xx + yy}{2a}\\right).<\/annotation><\/semantics><\/math><\/p>\n<p>5) Editio princeps et Manuscriptus: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mrow><mn>4<\/mn><mi>x<\/mi><mi>x<\/mi><mo>−<\/mo><mi>y<\/mi><mi>y<\/mi><\/mrow><mrow><mn>2<\/mn><mi>a<\/mi><\/mrow><\/mfrac><annotation encoding=\"application/x-tex\">\\frac{4xx - yy}{2a}<\/annotation><\/semantics><\/math> loco <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mrow><mn>4<\/mn><mi>x<\/mi><mi>x<\/mi><mo>+<\/mo><mi>y<\/mi><mi>y<\/mi><\/mrow><mrow><mn>2<\/mn><mi>a<\/mi><\/mrow><\/mfrac><annotation encoding=\"application/x-tex\">\\frac{4xx + yy}{2a}<\/annotation><\/semantics><\/math>. Correxit EJA.<\/p>", "typst": "Praeterea autem eadem particula $M$ sollicitabitur in directione $M R$ ad $M C$ normali, vi#super[5])\n\n$ = frac(3 S x y, a^3 sqrt(\\(x^2 + y^2\\))) + frac(3 S y\\(4 x x + y y\\), 2 a^4 sqrt(\\(x^2 + y^2\\))) = frac(3 S y, a^3 sqrt(\\(x^2 + y^2\\))) (x + frac(4 x x + y y, 2 a)) . $\n\n5) Editio princeps et Manuscriptus: $frac(4 x x - y y, 2 a)$ loco $frac(4 x x + y y, 2 a)$. Correxit EJA."}, "en": {"html": "<p>Furthermore, this same particle <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>M<\/mi><annotation encoding=\"application/x-tex\">M<\/annotation><\/semantics><\/math> will be urged in the direction <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M<\/mi><mi>R<\/mi><\/mrow><annotation encoding=\"application/x-tex\">MR<\/annotation><\/semantics><\/math> perpendicular to <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M<\/mi><mi>C<\/mi><\/mrow><annotation encoding=\"application/x-tex\">MC<\/annotation><\/semantics><\/math> by the force<sup>5)<\/sup><\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mfrac><mrow><mn>3<\/mn><mi>S<\/mi><mi>x<\/mi><mi>y<\/mi><\/mrow><mrow><msup><mi>a<\/mi><mn>3<\/mn><\/msup><msqrt><mrow><mo stretchy=\"false\" form=\"prefix\">(<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\" form=\"postfix\">)<\/mo><\/mrow><\/msqrt><\/mrow><\/mfrac><mo>+<\/mo><mfrac><mrow><mn>3<\/mn><mi>S<\/mi><mi>y<\/mi><mo stretchy=\"false\" form=\"prefix\">(<\/mo><mn>4<\/mn><mi>x<\/mi><mi>x<\/mi><mo>+<\/mo><mi>y<\/mi><mi>y<\/mi><mo stretchy=\"false\" form=\"postfix\">)<\/mo><\/mrow><mrow><mn>2<\/mn><msup><mi>a<\/mi><mn>4<\/mn><\/msup><msqrt><mrow><mo stretchy=\"false\" form=\"prefix\">(<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\" form=\"postfix\">)<\/mo><\/mrow><\/msqrt><\/mrow><\/mfrac><mo>=<\/mo><mfrac><mrow><mn>3<\/mn><mi>S<\/mi><mi>y<\/mi><\/mrow><mrow><msup><mi>a<\/mi><mn>3<\/mn><\/msup><msqrt><mrow><mo stretchy=\"false\" form=\"prefix\">(<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\" form=\"postfix\">)<\/mo><\/mrow><\/msqrt><\/mrow><\/mfrac><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>x<\/mi><mo>+<\/mo><mfrac><mrow><mn>4<\/mn><mi>x<\/mi><mi>x<\/mi><mo>+<\/mo><mi>y<\/mi><mi>y<\/mi><\/mrow><mrow><mn>2<\/mn><mi>a<\/mi><\/mrow><\/mfrac><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mi>.<\/mi><\/mrow><annotation encoding=\"application/x-tex\">= \\frac{3Sxy}{a^3 \\sqrt{(x^2 + y^2)}} + \\frac{3Sy(4xx + yy)}{2a^4 \\sqrt{(x^2 + y^2)}} = \\frac{3Sy}{a^3 \\sqrt{(x^2 + y^2)}} \\left( x + \\frac{4xx + yy}{2a} \\right).<\/annotation><\/semantics><\/math><\/p>\n<p>5) First edition and Manuscript: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mrow><mn>4<\/mn><mi>x<\/mi><mi>x<\/mi><mo>−<\/mo><mi>y<\/mi><mi>y<\/mi><\/mrow><mrow><mn>2<\/mn><mi>a<\/mi><\/mrow><\/mfrac><annotation encoding=\"application/x-tex\">\\frac{4xx - yy}{2a}<\/annotation><\/semantics><\/math> instead of <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mrow><mn>4<\/mn><mi>x<\/mi><mi>x<\/mi><mo>+<\/mo><mi>y<\/mi><mi>y<\/mi><\/mrow><mrow><mn>2<\/mn><mi>a<\/mi><\/mrow><\/mfrac><annotation encoding=\"application/x-tex\">\\frac{4xx + yy}{2a}<\/annotation><\/semantics><\/math> Corrected by EJA.<\/p>", "typst": "Furthermore, this same particle $M$ will be urged in the direction $M R$ perpendicular to $M C$ by the force#super[5)]\n\n$ = frac(3 S x y, a^3 sqrt(\\(x^2 + y^2\\))) + frac(3 S y\\(4 x x + y y\\), 2 a^4 sqrt(\\(x^2 + y^2\\))) = frac(3 S y, a^3 sqrt(\\(x^2 + y^2\\))) (x + frac(4 x x + y y, 2 a)) . $\n\n5) First edition and Manuscript: $frac(4 x x - y y, 2 a)$ instead of $frac(4 x x + y y, 2 a)$ Corrected by EJA."}}, {"id": "first-order", "section": "§27", "heading": "Both forces to first order", "pidx": [18], "pages": ["37"], "loci": ["fr:enestroem/E57/0018/p08"], "viewer": "enestroem/E57?p=19", "steps": ["first_MC", "first_MR"], "see": [], "model": [], "corrections": [], "notes": [{"html": "<p><em>Rem crassius inspiciendo<\/em>: only the first term of each formula is kept. These two expressions are the conclusion of the argument; §§28–29 read consequences off them.<\/p>", "typst": "#emph[Rem crassius inspiciendo]: only the first term of each formula is kept. These two expressions are the conclusion of the argument; §§28--29 read consequences off them."}, {"html": "<p>The question of the emendation does not touch this result: both readings have the same first term.<\/p>", "typst": "The question of the emendation does not touch this result: both readings have the same first term."}], "la": {"html": "<p>Atque cum in his formulis termini primi posteriores multis vicibus excedant, rem crassius inspiciendo, particula <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>M<\/mi><annotation encoding=\"application/x-tex\">M<\/annotation><\/semantics><\/math> a vi Solis Lunaeve secundum <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M<\/mi><mi>C<\/mi><\/mrow><annotation encoding=\"application/x-tex\">MC<\/annotation><\/semantics><\/math> urgebitur vi <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mfrac><mrow><mi>S<\/mi><mo stretchy=\"false\" form=\"prefix\">(<\/mo><mi>y<\/mi><mi>y<\/mi><mo>−<\/mo><mn>2<\/mn><mi>x<\/mi><mi>x<\/mi><mo stretchy=\"false\" form=\"postfix\">)<\/mo><\/mrow><mrow><msup><mi>a<\/mi><mn>3<\/mn><\/msup><msqrt><mrow><mo stretchy=\"false\" form=\"prefix\">(<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\" form=\"postfix\">)<\/mo><\/mrow><\/msqrt><\/mrow><\/mfrac><\/mrow><annotation encoding=\"application/x-tex\">= \\frac{S(yy - 2xx)}{a^3\\sqrt{(x^2+y^2)}}<\/annotation><\/semantics><\/math>, in directione vero <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M<\/mi><mi>R<\/mi><\/mrow><annotation encoding=\"application/x-tex\">MR<\/annotation><\/semantics><\/math> vi <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mfrac><mrow><mn>3<\/mn><mi>S<\/mi><mi>x<\/mi><mi>y<\/mi><\/mrow><mrow><msup><mi>a<\/mi><mn>3<\/mn><\/msup><msqrt><mrow><mo stretchy=\"false\" form=\"prefix\">(<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\" form=\"postfix\">)<\/mo><\/mrow><\/msqrt><\/mrow><\/mfrac><\/mrow><annotation encoding=\"application/x-tex\">= \\frac{3Sxy}{a^3\\sqrt{(x^2+y^2)}}<\/annotation><\/semantics><\/math>.<\/p>", "typst": "Atque cum in his formulis termini primi posteriores multis vicibus excedant, rem crassius inspiciendo, particula $M$ a vi Solis Lunaeve secundum $M C$ urgebitur vi $= frac(S\\(y y - 2 x x\\), a^3 sqrt(\\(x^2 + y^2\\)))$, in directione vero $M R$ vi $= frac(3 S x y, a^3 sqrt(\\(x^2 + y^2\\)))$."}, "en": {"html": "<p>And since in these formulas the first terms exceed the subsequent ones many times over, to a rougher approximation, the particle <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>M<\/mi><annotation encoding=\"application/x-tex\">M<\/annotation><\/semantics><\/math> will be urged by the force of the Sun or Moon along <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M<\/mi><mi>C<\/mi><\/mrow><annotation encoding=\"application/x-tex\">MC<\/annotation><\/semantics><\/math> with a force <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mfrac><mrow><mi>S<\/mi><mo stretchy=\"false\" form=\"prefix\">(<\/mo><mi>y<\/mi><mi>y<\/mi><mo>−<\/mo><mn>2<\/mn><mi>x<\/mi><mi>x<\/mi><mo stretchy=\"false\" form=\"postfix\">)<\/mo><\/mrow><mrow><msup><mi>a<\/mi><mn>3<\/mn><\/msup><msqrt><mrow><mo stretchy=\"false\" form=\"prefix\">(<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\" form=\"postfix\">)<\/mo><\/mrow><\/msqrt><\/mrow><\/mfrac><\/mrow><annotation encoding=\"application/x-tex\">= \\frac{S(yy - 2xx)}{a^3 \\sqrt{(x^2 + y^2)}}<\/annotation><\/semantics><\/math>, and in the direction <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M<\/mi><mi>R<\/mi><\/mrow><annotation encoding=\"application/x-tex\">MR<\/annotation><\/semantics><\/math> with a force <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mfrac><mrow><mn>3<\/mn><mi>S<\/mi><mi>x<\/mi><mi>y<\/mi><\/mrow><mrow><msup><mi>a<\/mi><mn>3<\/mn><\/msup><msqrt><mrow><mo stretchy=\"false\" form=\"prefix\">(<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\" form=\"postfix\">)<\/mo><\/mrow><\/msqrt><\/mrow><\/mfrac><mi>.<\/mi><\/mrow><annotation encoding=\"application/x-tex\">= \\frac{3Sxy}{a^3 \\sqrt{(x^2 + y^2)}}.<\/annotation><\/semantics><\/math><\/p>", "typst": "And since in these formulas the first terms exceed the subsequent ones many times over, to a rougher approximation, the particle $M$ will be urged by the force of the Sun or Moon along $M C$ with a force $= frac(S\\(y y - 2 x x\\), a^3 sqrt(\\(x^2 + y^2\\)))$, and in the direction $M R$ with a force $= frac(3 S x y, a^3 sqrt(\\(x^2 + y^2\\))) .$"}}, {"id": "gravity-sign", "section": "§28", "heading": "Where gravity is increased and where diminished", "pidx": [18, 19], "pages": ["37", "38"], "loci": ["fr:enestroem/E57/0018/p09", "fr:enestroem/E57/0019/p02"], "viewer": "enestroem/E57?p=19", "steps": ["vertical"], "see": [], "model": [], "corrections": [], "notes": [{"html": "<p>With <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>=<\/mo><mi>ρ<\/mi><mrow><mi mathvariant=\"normal\">cos<\/mi><mo>&#8289;<\/mo><\/mrow><mi>φ<\/mi><\/mrow><annotation encoding=\"application/x-tex\">x = \\rho\\cos\\varphi<\/annotation><\/semantics><\/math>, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y<\/mi><mo>=<\/mo><mi>ρ<\/mi><mrow><mi mathvariant=\"normal\">sin<\/mi><mo>&#8289;<\/mo><\/mrow><mi>φ<\/mi><\/mrow><annotation encoding=\"application/x-tex\">y = \\rho\\sin\\varphi<\/annotation><\/semantics><\/math> the force towards the centre is <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mrow><mi>S<\/mi><mi>ρ<\/mi><\/mrow><msup><mi>a<\/mi><mn>3<\/mn><\/msup><\/mfrac><mo stretchy=\"false\" form=\"prefix\">(<\/mo><mn>1<\/mn><mo>−<\/mo><mn>3<\/mn><msup><mrow><mi mathvariant=\"normal\">cos<\/mi><mo>&#8289;<\/mo><\/mrow><mn>2<\/mn><\/msup><mi>φ<\
